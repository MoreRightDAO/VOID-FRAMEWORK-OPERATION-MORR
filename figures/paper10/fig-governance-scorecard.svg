<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 640" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="floorG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e63946;stop-opacity:0.06" />
      <stop offset="100%" style="stop-color:#e63946;stop-opacity:0.02" />
    </linearGradient>
    <filter id="sh">
      <feDropShadow dx="1" dy="1" stdDeviation="2" flood-opacity="0.1"/>
    </filter>
    <marker id="axM" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#495057"/>
    </marker>
  </defs>

  <rect width="920" height="640" fill="#fafafa" rx="8"/>

  <!-- Title -->
  <text x="460" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#1a1a2e">The 5,000-Year Floor: Governance Void Scores</text>
  <text x="460" y="58" text-anchor="middle" font-size="13" fill="#6c757d">Every governance form humanity has tried scores ≥ 5/12. The scored monarchy breaks the floor at 2/12.</text>

  <!-- Chart area: x=80..860, y=85..520 -->
  <!-- Y-axis -->
  <line x1="80" y1="520" x2="80" y2="78" stroke="#495057" stroke-width="2" marker-end="url(#axM)"/>
  <text x="35" y="300" text-anchor="middle" font-size="14" font-weight="600" fill="#495057" transform="rotate(-90,35,300)">Void Score V(G) — 12-point scale</text>

  <!-- Y ticks -->
  <line x1="75" y1="520" x2="85" y2="520" stroke="#495057" stroke-width="1.5"/>
  <text x="70" y="524" text-anchor="end" font-size="11" fill="#495057">0</text>
  <line x1="75" y1="475" x2="85" y2="475" stroke="#495057" stroke-width="1.5"/>
  <text x="70" y="479" text-anchor="end" font-size="11" fill="#495057">1</text>
  <line x1="75" y1="430" x2="85" y2="430" stroke="#495057" stroke-width="1.5"/>
  <text x="70" y="434" text-anchor="end" font-size="11" fill="#495057">2</text>
  <line x1="75" y1="385" x2="85" y2="385" stroke="#495057" stroke-width="1.5"/>
  <text x="70" y="389" text-anchor="end" font-size="11" fill="#495057">3</text>
  <line x1="75" y1="340" x2="85" y2="340" stroke="#495057" stroke-width="1.5"/>
  <text x="70" y="344" text-anchor="end" font-size="11" fill="#495057">4</text>
  <line x1="75" y1="295" x2="85" y2="295" stroke="#495057" stroke-width="1.5"/>
  <text x="70" y="299" text-anchor="end" font-size="11" fill="#495057">5</text>
  <line x1="75" y1="250" x2="85" y2="250" stroke="#495057" stroke-width="1.5"/>
  <text x="70" y="254" text-anchor="end" font-size="11" fill="#495057">6</text>
  <line x1="75" y1="205" x2="85" y2="205" stroke="#495057" stroke-width="1.5"/>
  <text x="70" y="209" text-anchor="end" font-size="11" fill="#495057">7</text>
  <line x1="75" y1="160" x2="85" y2="160" stroke="#495057" stroke-width="1.5"/>
  <text x="70" y="164" text-anchor="end" font-size="11" fill="#495057">8</text>
  <line x1="75" y1="115" x2="85" y2="115" stroke="#495057" stroke-width="1.5"/>
  <text x="70" y="119" text-anchor="end" font-size="11" fill="#495057">9</text>
  <line x1="75" y1="90" x2="85" y2="90" stroke="#495057" stroke-width="1.5"/>
  <text x="70" y="94" text-anchor="end" font-size="11" fill="#495057">10</text>

  <!-- 5,000-Year Floor line -->
  <rect x="80" y="85" width="780" height="235" fill="url(#floorG)"/>
  <line x1="80" y1="295" x2="860" y2="295" stroke="#e63946" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="870" y="290" font-size="12" font-weight="700" fill="#e63946">FLOOR (V=5)</text>

  <!-- X baseline -->
  <line x1="80" y1="520" x2="860" y2="520" stroke="#495057" stroke-width="1"/>

  <!-- === GOVERNANCE BARS === -->
  <!-- Each bar: x position, score, color, label -->
  <!-- Using 16 governance models from the paper, sorted roughly by era -->

  <!-- 1. Athenian democracy: 6/12 -->
  <rect x="95" y="250" width="38" height="270" rx="3" fill="#0077b6" opacity="0.7"/>
  <text x="114" y="540" text-anchor="middle" font-size="8" fill="#495057" transform="rotate(-45,114,540)">Athenian democracy</text>
  <text x="114" y="244" text-anchor="middle" font-size="10" font-weight="700" fill="#0077b6">6</text>

  <!-- 2. Roman Republic: 7/12 -->
  <rect x="140" y="205" width="38" height="315" rx="3" fill="#0077b6" opacity="0.7"/>
  <text x="159" y="540" text-anchor="middle" font-size="8" fill="#495057" transform="rotate(-45,159,540)">Roman Republic</text>
  <text x="159" y="199" text-anchor="middle" font-size="10" font-weight="700" fill="#0077b6">7</text>

  <!-- 3. Feudal monarchy: 7/12 -->
  <rect x="185" y="205" width="38" height="315" rx="3" fill="#264653" opacity="0.7"/>
  <text x="204" y="540" text-anchor="middle" font-size="8" fill="#495057" transform="rotate(-45,204,540)">Feudal monarchy</text>
  <text x="204" y="199" text-anchor="middle" font-size="10" font-weight="700" fill="#264653">7</text>

  <!-- 4. Absolute monarchy: 5/12 -->
  <rect x="230" y="295" width="38" height="225" rx="3" fill="#264653" opacity="0.7"/>
  <text x="249" y="540" text-anchor="middle" font-size="8" fill="#495057" transform="rotate(-45,249,540)">Absolute monarchy</text>
  <text x="249" y="289" text-anchor="middle" font-size="10" font-weight="700" fill="#264653">5</text>

  <!-- 5. Constitutional monarchy: 6/12 -->
  <rect x="275" y="250" width="38" height="270" rx="3" fill="#264653" opacity="0.7"/>
  <text x="294" y="540" text-anchor="middle" font-size="8" fill="#495057" transform="rotate(-45,294,540)">Constitutional monarchy</text>
  <text x="294" y="244" text-anchor="middle" font-size="10" font-weight="700" fill="#264653">6</text>

  <!-- 6. Parliamentary democracy: 7/12 -->
  <rect x="320" y="205" width="38" height="315" rx="3" fill="#0077b6" opacity="0.7"/>
  <text x="339" y="540" text-anchor="middle" font-size="8" fill="#495057" transform="rotate(-45,339,540)">Parliamentary</text>
  <text x="339" y="199" text-anchor="middle" font-size="10" font-weight="700" fill="#0077b6">7</text>

  <!-- 7. Presidential democracy: 7/12 -->
  <rect x="365" y="205" width="38" height="315" rx="3" fill="#0077b6" opacity="0.7"/>
  <text x="384" y="540" text-anchor="middle" font-size="8" fill="#495057" transform="rotate(-45,384,540)">Presidential</text>
  <text x="384" y="199" text-anchor="middle" font-size="10" font-weight="700" fill="#0077b6">7</text>

  <!-- 8. Technocracy: 6/12 -->
  <rect x="410" y="250" width="38" height="270" rx="3" fill="#6a4c93" opacity="0.7"/>
  <text x="429" y="540" text-anchor="middle" font-size="8" fill="#495057" transform="rotate(-45,429,540)">Technocracy</text>
  <text x="429" y="244" text-anchor="middle" font-size="10" font-weight="700" fill="#6a4c93">6</text>

  <!-- 9. One-party state: 8/12 -->
  <rect x="455" y="160" width="38" height="360" rx="3" fill="#e63946" opacity="0.6"/>
  <text x="474" y="540" text-anchor="middle" font-size="8" fill="#495057" transform="rotate(-45,474,540)">One-party state</text>
  <text x="474" y="154" text-anchor="middle" font-size="10" font-weight="700" fill="#e63946">8</text>

  <!-- 10. Theocracy: 7/12 -->
  <rect x="500" y="205" width="38" height="315" rx="3" fill="#e76f51" opacity="0.7"/>
  <text x="519" y="540" text-anchor="middle" font-size="8" fill="#495057" transform="rotate(-45,519,540)">Theocracy</text>
  <text x="519" y="199" text-anchor="middle" font-size="10" font-weight="700" fill="#e76f51">7</text>

  <!-- 11. Corporate board: 6/12 -->
  <rect x="545" y="250" width="38" height="270" rx="3" fill="#f4a261" opacity="0.7"/>
  <text x="564" y="540" text-anchor="middle" font-size="8" fill="#495057" transform="rotate(-45,564,540)">Corporate board</text>
  <text x="564" y="244" text-anchor="middle" font-size="10" font-weight="700" fill="#f4a261">6</text>

  <!-- 12. Cooperative: 6/12 -->
  <rect x="590" y="250" width="38" height="270" rx="3" fill="#f4a261" opacity="0.7"/>
  <text x="609" y="540" text-anchor="middle" font-size="8" fill="#495057" transform="rotate(-45,609,540)">Cooperative</text>
  <text x="609" y="244" text-anchor="middle" font-size="10" font-weight="700" fill="#f4a261">6</text>

  <!-- 13. Standard DAO: 10/12 (WORST) -->
  <rect x="635" y="90" width="38" height="430" rx="3" fill="#e63946" opacity="0.8"/>
  <text x="654" y="540" text-anchor="middle" font-size="8" fill="#495057" transform="rotate(-45,654,540)">Standard DAO</text>
  <text x="654" y="85" text-anchor="middle" font-size="12" font-weight="800" fill="#e63946">10</text>

  <!-- 14. Liquid democracy: 8/12 -->
  <rect x="680" y="160" width="38" height="360" rx="3" fill="#e63946" opacity="0.6"/>
  <text x="699" y="540" text-anchor="middle" font-size="8" fill="#495057" transform="rotate(-45,699,540)">Liquid democracy</text>
  <text x="699" y="154" text-anchor="middle" font-size="10" font-weight="700" fill="#e63946">8</text>

  <!-- 15. Futarchy: 7/12 -->
  <rect x="725" y="205" width="38" height="315" rx="3" fill="#e76f51" opacity="0.7"/>
  <text x="744" y="540" text-anchor="middle" font-size="8" fill="#495057" transform="rotate(-45,744,540)">Futarchy</text>
  <text x="744" y="199" text-anchor="middle" font-size="10" font-weight="700" fill="#e76f51">7</text>

  <!-- 16. SCORED MONARCHY: 2/12 (OUTLIER — below floor) -->
  <rect x="790" y="430" width="50" height="90" rx="3" fill="#2a9d8f" stroke="#2a9d8f" stroke-width="2"/>
  <text x="815" y="540" text-anchor="middle" font-size="9" font-weight="700" fill="#2a9d8f" transform="rotate(-45,815,540)">Scored monarchy</text>
  <text x="815" y="422" text-anchor="middle" font-size="14" font-weight="800" fill="#2a9d8f">2</text>

  <!-- Callout arrow to scored monarchy -->
  <line x1="815" y1="395" x2="815" y2="415" stroke="#2a9d8f" stroke-width="2"/>
  <rect x="745" y="365" width="140" height="28" rx="4" fill="#2a9d8f" opacity="0.15" stroke="#2a9d8f" stroke-width="1"/>
  <text x="815" y="384" text-anchor="middle" font-size="11" font-weight="700" fill="#2a9d8f">BREAKS THE FLOOR</text>

  <!-- Summary -->
  <rect x="80" y="580" width="760" height="45" rx="6" fill="white" stroke="#1a1a2e" stroke-width="1.5" filter="url(#sh)"/>
  <text x="460" y="600" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a2e">16 governance models across 5,000 years — all score ≥ 5/12 except scored monarchy (2/12)</text>
  <text x="460" y="617" text-anchor="middle" font-size="12" fill="#495057">Standard DAOs score 10/12 — worse than unconstrained monarchy (5/12). Adding voting layers increases void score.</text>
</svg>