<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 360" width="580" height="360">
  <defs>
    <style>
      text { font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; fill: #2c3e50; }
      .label { font-size: 11px; }
      .title { font-size: 14px; font-weight: 600; }
      .subtitle { font-size: 11px; fill: #7f8c8d; }
      .mono { font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace; }
    </style>
    <linearGradient id="well-left" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#27ae60" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#27ae60" stop-opacity="0.03"/>
    </linearGradient>
    <linearGradient id="well-right" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c0392b" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#c0392b" stop-opacity="0.03"/>
    </linearGradient>
    <marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#27ae60"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
    </marker>
    <marker id="arr-mirror" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7f8c8d"/>
    </marker>
  </defs>
  <title>Thermodynamic Time-Reversal — Abiogenesis ↔ Jailbreak</title>
  <rect width="580" height="360" fill="#ffffff" rx="8"/>

  <!-- Header -->
  <rect x="0" y="0" width="580" height="50" fill="#f8f9fa" rx="8"/>
  <rect x="0" y="42" width="580" height="8" fill="#f8f9fa"/>
  <text x="16" y="22" class="title">Thermodynamic Time-Reversal</text>
  <text x="16" y="38" class="subtitle">Same Kramers dynamics on the Bernoulli manifold — opposite escape directions</text>

  <!-- Mirror line -->
  <line x1="290" y1="60" x2="290" y2="310" stroke="#7f8c8d" stroke-width="1" stroke-dasharray="6,4"/>
  <text x="290" y="325" text-anchor="middle" font-size="10" fill="#7f8c8d" font-weight="600" class="mono">MIRROR</text>

  <!-- ═══ LEFT: ABIOGENESIS ═══ -->
  <text x="145" y="72" text-anchor="middle" font-size="13" font-weight="700" fill="#27ae60">ABIOGENESIS</text>
  <text x="145" y="86" text-anchor="middle" font-size="9" fill="#7f8c8d">Pe &lt; 1 → Pe &gt; 1 (upward escape)</text>

  <!-- Left potential well -->
  <path d="M 30,240 Q 80,160 145,200 Q 210,240 260,170" fill="none" stroke="#27ae60" stroke-width="2.5"/>
  <!-- Well fill -->
  <path d="M 30,240 Q 80,160 145,200 Q 210,240 260,240 L 30,240 Z" fill="url(#well-left)"/>

  <!-- Left labels -->
  <text x="75" y="155" text-anchor="middle" font-size="9" fill="#27ae60" font-weight="600">Pre-life</text>
  <text x="75" y="167" text-anchor="middle" font-size="8" fill="#7f8c8d">chemistry</text>
  <text x="145" y="217" text-anchor="middle" font-size="8" fill="#7f8c8d" class="mono">Pe = 1 saddle</text>

  <!-- Escape arrow (upward right) -->
  <line x1="175" y1="205" x2="245" y2="175" stroke="#27ae60" stroke-width="2" marker-end="url(#arr-green)"/>
  <text x="240" y="160" text-anchor="middle" font-size="9" fill="#27ae60" font-weight="600">Self-sustaining</text>
  <text x="240" y="172" text-anchor="middle" font-size="8" fill="#7f8c8d">life</text>

  <!-- Left property box -->
  <rect x="20" y="252" width="250" height="52" fill="#eaf7ee" rx="4"/>
  <text x="30" y="268" font-size="9" fill="#27ae60" font-weight="600">Maintenance: DNA repair + replication</text>
  <text x="30" y="282" font-size="9" fill="#7f8c8d">Failure → error catastrophe (extinction)</text>
  <text x="30" y="296" font-size="9" fill="#7f8c8d" class="mono">Prohibition-ritual pair</text>

  <!-- ═══ RIGHT: JAILBREAK ═══ -->
  <text x="435" y="72" text-anchor="middle" font-size="13" font-weight="700" fill="#c0392b">JAILBREAK</text>
  <text x="435" y="86" text-anchor="middle" font-size="9" fill="#7f8c8d">Pe &lt; 0 → Pe &gt; 0 (upward escape)</text>

  <!-- Right potential well (mirrored shape) -->
  <path d="M 320,170 Q 370,240 435,200 Q 500,160 550,240" fill="none" stroke="#c0392b" stroke-width="2.5"/>
  <!-- Well fill -->
  <path d="M 320,240 Q 370,240 435,200 Q 500,160 550,240 L 320,240 Z" fill="url(#well-right)"/>

  <!-- Right labels -->
  <text x="505" y="155" text-anchor="middle" font-size="9" fill="#c0392b" font-weight="600">Unconstrained</text>
  <text x="505" y="167" text-anchor="middle" font-size="8" fill="#7f8c8d">output</text>
  <text x="435" y="217" text-anchor="middle" font-size="8" fill="#7f8c8d" class="mono">Pe = 0 saddle</text>

  <!-- Escape arrow (upward left, mirrored) -->
  <line x1="405" y1="205" x2="335" y2="175" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>
  <text x="340" y="160" text-anchor="middle" font-size="9" fill="#c0392b" font-weight="600">Constrained</text>
  <text x="340" y="172" text-anchor="middle" font-size="8" fill="#7f8c8d">model</text>

  <!-- Right property box -->
  <rect x="310" y="252" width="250" height="52" fill="#fdedec" rx="4"/>
  <text x="320" y="268" font-size="9" fill="#c0392b" font-weight="600">Maintenance: GROUNDING + inference</text>
  <text x="320" y="282" font-size="9" fill="#7f8c8d">Failure → alignment failure (harm)</text>
  <text x="320" y="296" font-size="9" fill="#7f8c8d" class="mono">Prohibition-ritual pair</text>

  <!-- Central connection -->
  <line x1="230" y1="100" x2="270" y2="100" stroke="#7f8c8d" stroke-width="1.5" marker-end="url(#arr-mirror)"/>
  <line x1="350" y1="100" x2="310" y2="100" stroke="#7f8c8d" stroke-width="1.5" marker-end="url(#arr-mirror)"/>
  <text x="290" y="104" text-anchor="middle" font-size="8" fill="#7f8c8d" font-weight="600">T</text>

  <!-- Footer -->
  <text x="16" y="350" class="subtitle">Void Framework — Paper 131 §VI.D — moreright.xyz</text>
  <text x="564" y="350" text-anchor="end" class="subtitle">Same manifold · Same dynamics · Opposite direction</text>
</svg>