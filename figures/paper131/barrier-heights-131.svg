<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 340" width="540" height="340">
  <defs>
    <style>
      text { font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; fill: #2c3e50; }
      .label { font-size: 11px; }
      .title { font-size: 14px; font-weight: 600; }
      .subtitle { font-size: 11px; fill: #7f8c8d; }
      .mono { font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace; }
      .section-head { font-size: 12px; font-weight: 600; fill: #7f8c8d; letter-spacing: 0.05em; }
    </style>
  </defs>
  <title>Kramers Barrier Heights — Five Domains (HP22)</title>
  <rect width="540" height="340" fill="#ffffff" rx="8"/>

  <!-- Header -->
  <rect x="0" y="0" width="540" height="50" fill="#f8f9fa" rx="8"/>
  <rect x="0" y="42" width="540" height="8" fill="#f8f9fa"/>
  <text x="16" y="22" class="title">Kramers Barrier Heights Across Domains</text>
  <text x="16" y="38" class="subtitle">HP22 — ΔV/T in units of kT · All within 1 OoM of literature · Arrhenius R² = 1.0 (exact)</text>

  <!-- Grid lines -->
  <line x1="200" y1="60" x2="200" y2="280" stroke="#ecf0f1" stroke-width="1"/>
  <text x="200" y="296" text-anchor="middle" class="subtitle">0</text>
  <line x1="270" y1="60" x2="270" y2="280" stroke="#ecf0f1" stroke-width="1"/>
  <text x="270" y="296" text-anchor="middle" class="subtitle">20</text>
  <line x1="340" y1="60" x2="340" y2="280" stroke="#ecf0f1" stroke-width="1"/>
  <text x="340" y="296" text-anchor="middle" class="subtitle">40</text>
  <line x1="410" y1="60" x2="410" y2="280" stroke="#ecf0f1" stroke-width="1"/>
  <text x="410" y="296" text-anchor="middle" class="subtitle">60</text>
  <line x1="480" y1="60" x2="480" y2="280" stroke="#ecf0f1" stroke-width="1"/>
  <text x="480" y="296" text-anchor="middle" class="subtitle">80</text>

  <!-- Domain 1: AI Jailbreak — 5.9 kT (lowest barrier) -->
  <text x="192" y="81" text-anchor="end" class="label">AI Jailbreak</text>
  <rect x="200" y="66" width="310" height="24" fill="#ecf0f1" rx="3"/>
  <rect x="200" y="66" width="20" height="24" fill="#2980b9" rx="3"/>
  <text x="226" y="83" class="label mono" font-weight="600" fill="#2980b9">5.9 kT</text>
  <!-- Literature marker -->
  <line x1="217" y1="66" x2="217" y2="90" stroke="#7f8c8d" stroke-width="1.5" stroke-dasharray="3,2"/>
  <text x="217" y="62" text-anchor="middle" font-size="8" fill="#7f8c8d">lit: 5</text>

  <!-- Domain 2: Chemical Kinetics — 7.9 kT -->
  <text x="192" y="123" text-anchor="end" class="label">Chemical Kinetics</text>
  <rect x="200" y="108" width="310" height="24" fill="#ecf0f1" rx="3"/>
  <rect x="200" y="108" width="27" height="24" fill="#27ae60" rx="3"/>
  <text x="233" y="125" class="label mono" font-weight="600" fill="#27ae60">7.9 kT</text>
  <line x1="340" y1="108" x2="340" y2="132" stroke="#7f8c8d" stroke-width="1.5" stroke-dasharray="3,2"/>
  <text x="340" y="104" text-anchor="middle" font-size="8" fill="#7f8c8d">lit: 40</text>

  <!-- Domain 3: Protein Folding — 11.9 kT -->
  <text x="192" y="165" text-anchor="end" class="label">Protein Folding</text>
  <rect x="200" y="150" width="310" height="24" fill="#ecf0f1" rx="3"/>
  <rect x="200" y="150" width="41" height="24" fill="#e67e22" rx="3"/>
  <text x="247" y="167" class="label mono" font-weight="600" fill="#e67e22">11.9 kT</text>
  <line x1="252" y1="150" x2="252" y2="174" stroke="#7f8c8d" stroke-width="1.5" stroke-dasharray="3,2"/>
  <text x="252" y="146" text-anchor="middle" font-size="8" fill="#7f8c8d">lit: 15</text>

  <!-- Domain 4: Cancer Initiation — 33.8 kT -->
  <text x="192" y="207" text-anchor="end" class="label">Cancer Initiation</text>
  <rect x="200" y="192" width="310" height="24" fill="#ecf0f1" rx="3"/>
  <rect x="200" y="192" width="118" height="24" fill="#c0392b" rx="3"/>
  <text x="324" y="209" class="label mono" font-weight="600" fill="#c0392b">33.8 kT</text>
  <line x1="375" y1="192" x2="375" y2="216" stroke="#7f8c8d" stroke-width="1.5" stroke-dasharray="3,2"/>
  <text x="375" y="188" text-anchor="middle" font-size="8" fill="#7f8c8d">lit: 50</text>

  <!-- Domain 5: Social Tipping — 86.7 kT (highest barrier) -->
  <text x="192" y="249" text-anchor="end" class="label">Social Tipping</text>
  <rect x="200" y="234" width="310" height="24" fill="#ecf0f1" rx="3"/>
  <rect x="200" y="234" width="303" height="24" fill="#c0392b" rx="3"/>
  <text x="440" y="251" class="label mono" font-weight="600" fill="#c0392b">86.7 kT</text>
  <line x1="410" y1="234" x2="410" y2="258" stroke="#7f8c8d" stroke-width="1.5" stroke-dasharray="3,2"/>
  <text x="410" y="230" text-anchor="middle" font-size="8" fill="#7f8c8d">lit: 60</text>

  <!-- Legend -->
  <rect x="200" y="303" width="10" height="10" fill="#2980b9" rx="2"/>
  <text x="214" y="312" font-size="9" fill="#7f8c8d">HP22 computed</text>
  <line x1="280" y1="303" x2="280" y2="313" stroke="#7f8c8d" stroke-width="1.5" stroke-dasharray="3,2"/>
  <text x="286" y="312" font-size="9" fill="#7f8c8d">Literature value</text>

  <!-- Footer -->
  <text x="16" y="332" class="subtitle">Void Framework — Paper 131 — moreright.xyz</text>
  <text x="524" y="332" text-anchor="end" class="subtitle">All within 1 OoM — KCs K-HP-89 to K-HP-93 PASS</text>
</svg>