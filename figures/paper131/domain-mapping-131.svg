  <text x="57" y="268" text-anchor="middle" class="cell" fill="#7f8c8d">5.9 kT</text>
  <text x="167" y="260" text-anchor="middle" class="cell">Model size</text>
  <text x="287" y="260" text-anchor="middle" class="cell">|Pe₀| (grounding)</text>
