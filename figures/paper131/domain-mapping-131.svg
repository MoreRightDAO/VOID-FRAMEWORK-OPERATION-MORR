  <rect x="560" y="120" width="110" height="36" fill="#f8f9fa" rx="2"/>
  <text x="57" y="135" text-anchor="middle" class="cell" font-weight="700" fill="#27ae60">Chemical</text>
  <text x="57" y="148" text-anchor="middle" class="cell" fill="#7f8c8d">7.9 kT</text>
  <text x="167" y="140" text-anchor="middle" class="cell">Molecular DoF</text>
  <text x="287" y="140" text-anchor="middle" class="cell">E_a / (k_BT·K)</text>
  <text x="402" y="140" text-anchor="middle" class="cell">Collision freq</text>
  <text x="507" y="140" text-anchor="middle" class="cell">2k_BT / K</text>
  <text x="615" y="140" text-anchor="middle" class="cell">1 / rate const</text>

  <!-- Row 2: Protein -->
  <rect x="10" y="160" width="95" height="36" fill="#fef5e7" rx="2"/>
