  <text x="167" y="340" text-anchor="middle" class="cell">Contact network</text>
  <text x="287" y="340" text-anchor="middle" class="cell">|R_t − 1|</text>
  <text x="402" y="340" text-anchor="middle" class="cell">Transmission rate</text>
  <text x="507" y="340" text-anchor="middle" class="cell">Dispersion k</text>
  <text x="615" y="340" text-anchor="middle" class="cell">Containment escape</text>

