  <text x="57" y="228" text-anchor="middle" class="cell" fill="#7f8c8d">33.8 kT</text>
  <text x="167" y="220" text-anchor="middle" class="cell">Intact suppressors</text>
  <text x="287" y="220" text-anchor="middle" class="cell">Kramers barrier</text>
