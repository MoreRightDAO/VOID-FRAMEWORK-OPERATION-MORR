  <text x="57" y="188" text-anchor="middle" class="cell" fill="#7f8c8d">11.9 kT</text>
  <text x="167" y="180" text-anchor="middle" class="cell">Chain length</text>
  <text x="287" y="180" text-anchor="middle" class="cell">Pe_amyloid − Pe_native</text>
  <text x="402" y="180" text-anchor="middle" class="cell">Conform. attempt</text>
