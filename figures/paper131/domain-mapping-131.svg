  <rect x="230" y="360" width="115" height="36" fill="#f8f9fa" rx="2"/>
  <rect x="350" y="360" width="105" height="36" fill="#f8f9fa" rx="2"/>
  <rect x="460" y="360" width="95" height="36" fill="#f8f9fa" rx="2"/>
  <rect x="560" y="360" width="110" height="36" fill="#f8f9fa" rx="2"/>
