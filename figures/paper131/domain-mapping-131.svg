<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 460" width="680" height="460">
  <defs>
    <style>
      text { font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; fill: #2c3e50; }
      .label { font-size: 10px; }
      .title { font-size: 14px; font-weight: 600; }
      .subtitle { font-size: 11px; fill: #7f8c8d; }
      .mono { font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace; }
      .cell { font-size: 9px; }
      .cell-head { font-size: 9.5px; font-weight: 700; fill: #ffffff; }
      .formula { font-size: 12px; font-weight: 600; }
    </style>
    <linearGradient id="hdr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#161b2e"/>
      <stop offset="100%" stop-color="#0d0f1a"/>
    </linearGradient>
  </defs>
  <title>One Equation, Eight Domains — Parameter Identification</title>
  <rect width="680" height="460" fill="#ffffff" rx="8"/>

  <!-- Dark header with formula -->
  <rect width="680" height="80" fill="url(#hdr)" rx="8"/>
  <rect y="72" width="680" height="8" fill="#0d0f1a"/>
  <text x="16" y="24" font-size="8" fill="#8b98b0" letter-spacing="0.12em" font-weight="600" class="mono">ONE EQUATION</text>
  <text x="340" y="50" text-anchor="middle" class="mono" font-size="15" fill="#ffffff" font-weight="700">τ = ν₀⁻¹ · exp( K · |ΔPe| / T_eff )</text>
  <text x="340" y="70" text-anchor="middle" font-size="10" fill="#8b98b0">Universal Kramers escape rate in Pe coordinates — same structure, eight readings</text>

  <!-- Column headers -->
  <rect x="10" y="90" width="95" height="26" fill="#34495e" rx="3"/>
  <text x="57" y="107" text-anchor="middle" class="cell-head">Domain</text>
  <rect x="110" y="90" width="115" height="26" fill="#34495e" rx="3"/>
  <text x="167" y="107" text-anchor="middle" class="cell-head">K (complexity)</text>
  <rect x="230" y="90" width="115" height="26" fill="#34495e" rx="3"/>
  <text x="287" y="107" text-anchor="middle" class="cell-head">ΔPe (barrier)</text>
  <rect x="350" y="90" width="105" height="26" fill="#34495e" rx="3"/>
  <text x="402" y="107" text-anchor="middle" class="cell-head">ν₀ (attempts)</text>
  <rect x="460" y="90" width="95" height="26" fill="#34495e" rx="3"/>
  <text x="507" y="107" text-anchor="middle" class="cell-head">α (noise)</text>
  <rect x="560" y="90" width="110" height="26" fill="#34495e" rx="3"/>
  <text x="615" y="107" text-anchor="middle" class="cell-head">τ (lifetime)</text>

  <!-- Row 1: Chemical -->
  <rect x="10" y="120" width="95" height="36" fill="#eaf7ee" rx="2"/>
  <rect x="110" y="120" width="115" height="36" fill="#f8f9fa" rx="2"/>
  <rect x="230" y="120" width="115" height="36" fill="#f8f9fa" rx="2"/>
  <rect x="350" y="120" width="105" height="36" fill="#f8f9fa" rx="2"/>
