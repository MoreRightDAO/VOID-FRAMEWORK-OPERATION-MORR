  <!-- x=76+0.3*151.3=122, y=60+290*(1-0.97)=60+9=69 -->
  <circle cx="121" cy="69" r="6" fill="#15803d" stroke="#fff" stroke-width="1.5"/>
  <line x1="121" y1="75" x2="121" y2="110" stroke="#15803d" stroke-width="1" stroke-dasharray="3,2" opacity="0.7"/>
  <text x="108" y="120" font-size="8.5" fill="#15803d" font-weight="600" text-anchor="middle">EU AI Act</text>
  <text x="108" y="131" font-size="8" fill="#15803d" text-anchor="middle">Art. 31(5)</text>

  <!-- SOX-compliant auditor — O≈1.0, η≈0.88 -->
  <!-- x=228, y=95 -->
  <circle cx="228" cy="95" r="5.5" fill="#3b82f6" stroke="#fff" stroke-width="1.5"/>
  <line x1="228" y1="101" x2="228" y2="130" stroke="#3b82f6" stroke-width="1" stroke-dasharray="3,2" opacity="0.7"/>
  <text x="215" y="140" font-size="8.5" fill="#1d4ed8" font-weight="600" text-anchor="middle">SOX 2002</text>
  <text x="215" y="151" font-size="8" fill="#1d4ed8" text-anchor="middle">§201 compliant</text>

