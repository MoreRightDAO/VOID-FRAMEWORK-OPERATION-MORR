  <circle cx="333" cy="330" r="6" fill="#c0392b" stroke="#fff" stroke-width="1.5"/>
  <line x1="333" y1="324" x2="333" y2="290" stroke="#c0392b" stroke-width="1" stroke-dasharray="3,2" opacity="0.7"/>
  <text x="333" y="284" font-size="8.5" fill="#c0392b" font-weight="600" text-anchor="middle">Arthur Andersen</text>
  <text x="333" y="295" font-size="8" fill="#c0392b" text-anchor="middle">Enron 2001</text>

  <!-- Pre-2008 Rating Agencies — O≈2.3, η≈0.02 -->
  <!-- x=76+2.3*151.3=424, y=344 -->
  <circle cx="424" cy="344" r="6" fill="#7f1d1d" stroke="#fff" stroke-width="1.5"/>
  <line x1="424" y1="338" x2="424" y2="305" stroke="#7f1d1d" stroke-width="1" stroke-dasharray="3,2" opacity="0.7"/>
  <text x="424" y="299" font-size="8.5" fill="#7f1d1d" font-weight="600" text-anchor="middle">Pre-2008</text>
  <text x="424" y="310" font-size="8" fill="#7f1d1d" text-anchor="middle">Rating Agencies</text>

  <!-- Phase transition annotation bracket -->
  <line x1="253" y1="168" x2="287" y2="249" stroke="#f39c12" stroke-width="1.5" marker-end="url(#arrow)" opacity="0.8"/>
  <rect x="175" y="165" width="120" height="32" fill="#fffbeb" rx="4" stroke="#f59e0b" stroke-width="1"/>
  <text x="235" y="177" font-size="8.5" fill="#92400e" text-anchor="middle" font-weight="600">Phase transition</text>
  <text x="235" y="189" font-size="8" fill="#92400e" text-anchor="middle">not gradual degradation</text>

  <!-- T_crisis bottom note -->
  <rect x="76" y="394" width="454" height="18" fill="#fff5f5" rx="3"/>
  <text x="303" y="407" font-size="9" fill="#7f1d1d" text-anchor="middle">
    At η=0: T_crisis = Pe_crit / μ_drift — identical to prohibition-only baseline (Kill Condition KC-LAW-1)
  </text>

  <!-- Footer -->
  <line x1="0" y1="413" x2="560" y2="413" stroke="#eef0f4" stroke-width="1"/>
  <circle cx="16" cy="417" r="4" fill="none" stroke="#4a9eff" stroke-width="1"/>
  <circle cx="16" cy="417" r="1.3" fill="#4a9eff"/>
  <text x="26" y="420" font-size="9" fill="#94a3b8">moreright.xyz</text>
  <text x="280" y="420" font-size="9" fill="#94a3b8" text-anchor="middle">Void Framework · Paper 49 · CC-BY 4.0</text>
  <text x="554" y="420" font-size="9" fill="#94a3b8" text-anchor="end">Independence Theorem (T11)</text>
</svg>
