<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 420" width="560" height="420">
  <defs>
    <style>
      text { font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; }
      .mono { font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace; }
    </style>
    <linearGradient id="hg49i" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0f1e"/>
      <stop offset="100%" stop-color="#0d0f1a"/>
    </linearGradient>
    <clipPath id="plotClip49">
      <rect x="76" y="60" width="454" height="290"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="560" height="420" fill="#ffffff" rx="8"/>

  <!-- Header -->
  <rect width="560" height="58" fill="url(#hg49i)" rx="8"/>
  <rect y="50" width="560" height="8" fill="#0d0f1a"/>
  <rect width="560" height="3" fill="#4a9eff" rx="8"/>

  <!-- MoreRight logo -->
  <circle cx="22" cy="21" r="9" fill="none" stroke="#4a9eff" stroke-width="1.6"/>
  <circle cx="22" cy="21" r="2.9" fill="#4a9eff"/>
  <text y="25" font-size="13" letter-spacing="-0.02em">
    <tspan x="36" font-weight="300" fill="#8b98b0">More</tspan><tspan font-weight="800" fill="#ffffff">Right</tspan>
  </text>

  <text x="16" y="44" font-size="15" font-weight="700" fill="#ffffff" letter-spacing="-0.015em">Independence Theorem: η Collapse Under Capture</text>
  <text x="544" y="30" font-size="8" fill="#8b98b0" text-anchor="end" letter-spacing="0.12em" font-weight="600" class="mono">PAPER 49 · T11</text>
  <text x="544" y="47" font-size="9" fill="#4a9eff" text-anchor="end" class="mono">FRACTAL OF LAW</text>

  <!-- Plot background -->
  <rect x="76" y="60" width="454" height="290" fill="#fafbfc" rx="3"/>

  <!-- Shaded regions -->
  <!-- Independent region (left) -->
  <rect x="76" y="60" width="211" height="290" fill="#f0fdf4" opacity="0.7" clip-path="url(#plotClip49)"/>
  <!-- Captured region (right) -->
  <rect x="287" y="60" width="243" height="290" fill="#fff5f5" opacity="0.7" clip-path="url(#plotClip49)"/>

  <!-- Grid lines (horizontal, η = 0.25, 0.5, 0.75) -->
  <line x1="76" y1="132" x2="530" y2="132" stroke="#e8ecef" stroke-width="1"/>
  <line x1="76" y1="205" x2="530" y2="205" stroke="#e8ecef" stroke-width="1"/>
  <line x1="76" y1="277" x2="530" y2="277" stroke="#e8ecef" stroke-width="1"/>

  <!-- Grid lines (vertical, O = 0.5, 1.0, 1.5, 2.0, 2.5) -->
  <line x1="152" y1="60" x2="152" y2="350" stroke="#e8ecef" stroke-width="1"/>
  <line x1="228" y1="60" x2="228" y2="350" stroke="#e8ecef" stroke-width="1"/>
  <line x1="303" y1="60" x2="303" y2="350" stroke="#e8ecef" stroke-width="1"/>
  <line x1="379" y1="60" x2="379" y2="350" stroke="#e8ecef" stroke-width="1"/>
  <line x1="454" y1="60" x2="454" y2="350" stroke="#e8ecef" stroke-width="1"/>

  <!-- O_p* critical threshold vertical line -->
  <line x1="287" y1="60" x2="287" y2="350" stroke="#f39c12" stroke-width="2" stroke-dasharray="7,4"/>

  <!-- Axes -->
  <line x1="76" y1="350" x2="530" y2="350" stroke="#c8cdd5" stroke-width="1.5"/>
  <line x1="76" y1="60" x2="76" y2="350" stroke="#c8cdd5" stroke-width="1.5"/>

  <!-- η=0 baseline reference line -->
  <line x1="76" y1="347" x2="530" y2="347" stroke="#c0392b" stroke-width="1.2" stroke-dasharray="3,3" opacity="0.5"/>

  <!-- ── Main curve: η vs O_performer ──
       Phase transition at O_p* ≈ 1.5 (x=287)
       Plot area: x=76 to 530 (W=454 for O=0 to 3, scale=151.3/unit)
                  y=60 to 350 (H=290 for η=1 to 0, scale=290)
       η=1 → y=60, η=0 → y=350
  -->
  <!-- Points along the curve:
    O=0.0: η=0.98 → y=60+290*(1-0.98)=60+6=66, x=76+0*151.3=76
    O=0.5: η=0.95 → y=60+290*0.05=60+15=75, x=76+0.5*151.3=152
    O=1.0: η=0.88 → y=60+290*0.12=60+35=95, x=76+1.0*151.3=228
    O=1.3: η=0.78 → y=60+290*0.22=60+64=124, x=76+1.3*151.3=273
    O=1.4: η=0.65 → y=60+290*0.35=60+102=162, x=76+1.4*151.3=288 (≈O_p*)
    O=1.5 (O_p*): η=0.35 → y=60+290*0.65=60+189=249, x=287
    O=1.6: η=0.14 → y=60+290*0.86=60+249=309, x=76+1.6*151.3=318
    O=1.7: η=0.07 → y=60+290*0.93=60+270=330, x=76+1.7*151.3=333
    O=2.0: η=0.03 → y=60+290*0.97=60+282=342, x=76+2.0*151.3=379
    O=2.5: η=0.01 → y=60+290*0.99=60+287=347, x=76+2.5*151.3=454
    O=3.0: η=0.01 → y=347, x=76+3.0*151.3=530
  -->
  <polyline
    points="76,66 152,75 228,95 273,124 285,162 287,249 318,309 333,330 379,342 454,347 530,347"
    fill="none" stroke="#1d4ed8" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Y axis labels (η) -->
  <text x="69" y="65" font-size="10" fill="#64748b" text-anchor="end" class="mono">1.0</text>
  <text x="69" y="136" font-size="10" fill="#64748b" text-anchor="end" class="mono">0.75</text>
  <text x="69" y="208" font-size="10" fill="#64748b" text-anchor="end" class="mono">0.50</text>
  <text x="69" y="280" font-size="10" fill="#64748b" text-anchor="end" class="mono">0.25</text>
  <text x="69" y="353" font-size="10" fill="#64748b" text-anchor="end" class="mono">0</text>

  <!-- Y axis title -->
  <text x="16" y="220" font-size="11" fill="#475569" font-weight="600" text-anchor="middle" transform="rotate(-90,16,220)">Ritual Discharge Efficiency η</text>

  <!-- X axis labels -->
  <text x="76" y="365" font-size="10" fill="#64748b" text-anchor="middle" class="mono">0</text>
  <text x="152" y="365" font-size="10" fill="#64748b" text-anchor="middle" class="mono">0.5</text>
  <text x="228" y="365" font-size="10" fill="#64748b" text-anchor="middle" class="mono">1.0</text>
  <text x="287" y="365" font-size="10" fill="#f39c12" text-anchor="middle" font-weight="700" class="mono">O_p*</text>
  <text x="303" y="365" font-size="10" fill="#64748b" text-anchor="middle" class="mono">1.5</text>
  <text x="379" y="365" font-size="10" fill="#64748b" text-anchor="middle" class="mono">2.0</text>
  <text x="454" y="365" font-size="10" fill="#64748b" text-anchor="middle" class="mono">2.5</text>
  <text x="530" y="365" font-size="10" fill="#64748b" text-anchor="middle" class="mono">3.0</text>

  <!-- X axis title -->
  <text x="303" y="382" font-size="11" fill="#475569" font-weight="600" text-anchor="middle">O_performer (Conflict of Interest)</text>

  <!-- O_p* label -->
  <text x="291" y="72" font-size="9" fill="#f39c12" font-weight="700" class="mono">O_p* (critical threshold)</text>
  <text x="291" y="83" font-size="8.5" fill="#f39c12">phase transition below</text>

  <!-- Region labels -->
  <text x="86" y="82" font-size="10" fill="#15803d" font-weight="700" letter-spacing="0.06em">INDEPENDENT</text>
  <text x="86" y="94" font-size="9" fill="#15803d">η → 1  ·  high-Pe mechanisms named</text>

  <text x="295" y="82" font-size="10" fill="#c0392b" font-weight="700" letter-spacing="0.06em">CAPTURED</text>
  <text x="295" y="94" font-size="9" fill="#c0392b">η → 0  ·  inverse selection</text>

  <!-- ── Historical examples (labeled dots) ── -->

