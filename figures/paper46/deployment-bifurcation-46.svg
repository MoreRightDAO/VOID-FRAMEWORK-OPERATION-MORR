<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 390" width="560" height="390">
  <defs>
    <style>
      text { font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; }
      .mono { font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace; }
    </style>
    <linearGradient id="hg46d" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#0d0f1a"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="560" height="390" fill="#ffffff" rx="8"/>

  <!-- Header -->
  <rect width="560" height="58" fill="url(#hg46d)" rx="8"/>
  <rect y="50" width="560" height="8" fill="#0d0f1a"/>
  <rect width="560" height="3" fill="#f59e0b" rx="8"/>

  <!-- MoreRight logo -->
  <circle cx="22" cy="21" r="9" fill="none" stroke="#4a9eff" stroke-width="1.6"/>
  <circle cx="22" cy="21" r="2.9" fill="#4a9eff"/>
  <text y="25" font-size="13" letter-spacing="-0.02em">
    <tspan x="36" font-weight="300" fill="#8b98b0">More</tspan><tspan font-weight="800" fill="#ffffff">Right</tspan>
  </text>
  <text x="16" y="44" font-size="15" font-weight="700" fill="#ffffff" letter-spacing="-0.015em">The Meta-Void: Same Instrument, Two Deployment Fates</text>
  <text x="544" y="30" font-size="8" fill="#8b98b0" text-anchor="end" letter-spacing="0.12em" font-weight="600" class="mono">PAPER 46 · GOODHART</text>
  <text x="544" y="47" font-size="9" fill="#f59e0b" text-anchor="end" class="mono">META-VOID</text>

  <!-- Root node: Bayesian void scoring instrument -->
  <rect x="150" y="66" width="260" height="34" fill="#f8fafc" rx="6" stroke="#64748b" stroke-width="1.5"/>
  <text x="280" y="79" font-size="10.5" font-weight="700" fill="#1e293b" text-anchor="middle">Bayesian Void Scoring Instrument</text>
  <text x="280" y="92" font-size="9" fill="#64748b" text-anchor="middle">same mathematical structure · same three conditions</text>

  <!-- Bifurcation arrows -->
  <!-- Left arrow to academic -->
  <path d="M200,100 Q180,120 140,135" fill="none" stroke="#15803d" stroke-width="1.8" stroke-dasharray="5,3"/>
  <polygon points="133,137 143,131 141,142" fill="#15803d"/>
  <!-- Right arrow to commercial -->
  <path d="M360,100 Q380,120 420,135" fill="none" stroke="#c0392b" stroke-width="1.8" stroke-dasharray="5,3"/>
  <polygon points="427,137 417,131 419,142" fill="#c0392b"/>

  <!-- Label on bifurcation fork -->
  <text x="280" y="118" font-size="9" fill="#94a3b8" text-anchor="middle">deployment context</text>
  <text x="185" y="125" font-size="8.5" fill="#15803d" text-anchor="middle">open priors</text>
  <text x="375" y="125" font-size="8.5" fill="#c0392b" text-anchor="middle">proprietary priors</text>

  <!-- ══ LEFT PANEL: Academic / Open ══ -->
  <rect x="16" y="140" width="248" height="190" fill="#f0fdf4" rx="6" stroke="#15803d" stroke-width="2"/>
  <rect x="16" y="140" width="248" height="36" fill="#15803d" rx="6"/>
  <rect x="16" y="162" width="248" height="14" fill="#15803d"/>
  <text x="140" y="155" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0.04em">ACADEMIC / OPEN DEPLOYMENT</text>
  <text x="140" y="168" font-size="9" fill="#bbf7d0" text-anchor="middle">open priors · pre-registered likelihoods · reproducible</text>

  <!-- Academic void index display -->
  <text x="32" y="200" font-size="10" fill="#14532d" font-weight="600">Void Index</text>
  <text x="252" y="200" font-size="28" font-weight="800" fill="#15803d" text-anchor="end">2/12</text>

  <!-- Academic O/R/C bars -->
  <text x="32" y="218" font-size="9" fill="#374151">O</text>
  <rect x="44" y="209" width="170" height="9" fill="#e2e8f0" rx="4"/>
  <text x="218" y="218" font-size="9" fill="#15803d" class="mono" font-weight="600" text-anchor="end">0</text>

  <text x="32" y="234" font-size="9" fill="#374151">R</text>
  <rect x="44" y="225" width="170" height="9" fill="#e2e8f0" rx="4"/>
  <rect x="44" y="225" width="57" height="9" fill="#15803d" rx="4"/>
  <text x="218" y="234" font-size="9" fill="#15803d" class="mono" font-weight="600" text-anchor="end">1</text>

  <text x="32" y="250" font-size="9" fill="#374151">α</text>
  <rect x="44" y="241" width="170" height="9" fill="#e2e8f0" rx="4"/>
  <rect x="44" y="241" width="57" height="9" fill="#15803d" rx="4"/>
  <text x="218" y="250" font-size="9" fill="#15803d" class="mono" font-weight="600" text-anchor="end">1</text>

  <!-- Pe display -->
  <rect x="32" y="260" width="200" height="28" fill="#dcfce7" rx="4"/>
  <text x="132" y="272" font-size="9.5" fill="#14532d" text-anchor="middle" font-weight="600">Péclet Number</text>
  <text x="132" y="283" font-size="9" fill="#15803d" text-anchor="middle" class="mono">Pe = 1.3 · Phase I Gas</text>

  <!-- Key properties -->
  <text x="32" y="304" font-size="9" fill="#14532d">✓ Prior sensitivity reported</text>
  <text x="32" y="316" font-size="9" fill="#14532d">✓ Credible intervals published</text>
  <text x="32" y="328" font-size="9" fill="#14532d">✓ Analyst team variation disclosed</text>

  <!-- ══ RIGHT PANEL: Commercial / Proprietary ══ -->
  <rect x="296" y="140" width="248" height="190" fill="#fff5f5" rx="6" stroke="#c0392b" stroke-width="2"/>
  <rect x="296" y="140" width="248" height="36" fill="#c0392b" rx="6"/>
  <rect x="296" y="162" width="248" height="14" fill="#c0392b"/>
  <text x="420" y="155" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0.04em">COMMERCIAL CERTIFICATION</text>
  <text x="420" y="168" font-size="9" fill="#fecaca" text-anchor="middle">proprietary priors · point outputs · incentive misalign</text>

  <!-- Commercial void index display -->
  <text x="312" y="200" font-size="10" fill="#7f1d1d" font-weight="600">Void Index</text>
  <text x="532" y="200" font-size="28" font-weight="800" fill="#c0392b" text-anchor="end">9/12</text>

  <!-- Commercial O/R/C bars -->
  <text x="312" y="218" font-size="9" fill="#374151">O</text>
  <rect x="324" y="209" width="170" height="9" fill="#e2e8f0" rx="4"/>
  <rect x="324" y="209" width="170" height="9" fill="#c0392b" rx="4"/>
  <text x="498" y="218" font-size="9" fill="#c0392b" class="mono" font-weight="600" text-anchor="end">3</text>

  <text x="312" y="234" font-size="9" fill="#374151">R</text>
  <rect x="324" y="225" width="170" height="9" fill="#e2e8f0" rx="4"/>
  <rect x="324" y="225" width="113" height="9" fill="#c0392b" rx="4"/>
  <text x="498" y="234" font-size="9" fill="#c0392b" class="mono" font-weight="600" text-anchor="end">2</text>

  <text x="312" y="250" font-size="9" fill="#374151">α</text>
  <rect x="324" y="241" width="170" height="9" fill="#e2e8f0" rx="4"/>
  <rect x="324" y="241" width="113" height="9" fill="#c0392b" rx="4"/>
  <text x="498" y="250" font-size="9" fill="#c0392b" class="mono" font-weight="600" text-anchor="end">2</text>

  <!-- Pe display -->
  <rect x="312" y="260" width="200" height="28" fill="#fee2e2" rx="4"/>
  <text x="412" y="272" font-size="9.5" fill="#7f1d1d" text-anchor="middle" font-weight="600">Péclet Number</text>
  <text x="412" y="283" font-size="9" fill="#c0392b" text-anchor="middle" class="mono">Pe = 5.1 · Phase IV Pandemonium</text>

  <!-- Key failure modes -->
  <text x="312" y="304" font-size="9" fill="#7f1d1d">✗ Prior opacity — inference unauditable</text>
  <text x="312" y="316" font-size="9" fill="#7f1d1d">✗ Goodhart gaming surface exposed</text>
  <text x="312" y="328" font-size="9" fill="#7f1d1d">✗ Regulatory capture via instrument</text>

  <!-- Modifier note -->
  <text x="140" y="348" font-size="9" fill="#64748b" text-anchor="middle">Mod: 0</text>
  <text x="420" y="348" font-size="9" fill="#64748b" text-anchor="middle">Mod: +2 (scale × capture)</text>

  <!-- Bottom note -->
  <rect x="16" y="354" width="528" height="20" fill="#fffbeb" rx="3" stroke="#f59e0b" stroke-width="1"/>
  <text x="280" y="368" font-size="9" fill="#92400e" text-anchor="middle">
    Same instrument. Deployment context determines whether the scoring apparatus becomes the void it measures.
  </text>

  <!-- Footer -->
  <line x1="0" y1="378" x2="560" y2="378" stroke="#eef0f4" stroke-width="1"/>
  <circle cx="16" cy="385" r="4" fill="none" stroke="#4a9eff" stroke-width="1"/>
  <circle cx="16" cy="385" r="1.3" fill="#4a9eff"/>
  <text x="26" y="388" font-size="9" fill="#94a3b8">moreright.xyz</text>
  <text x="280" y="388" font-size="9" fill="#94a3b8" text-anchor="middle">Void Framework · Paper 46 · CC-BY 4.0</text>
  <text x="554" y="388" font-size="9" fill="#94a3b8" text-anchor="end">Goodhart · Meta-Void · EU AI Act</text>
</svg>
