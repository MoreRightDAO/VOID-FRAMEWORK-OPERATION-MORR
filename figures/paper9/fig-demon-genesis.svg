<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="ax" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#495057"/>
    </marker>
    <marker id="arR" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e63946"/>
    </marker>
    <filter id="sh">
      <feDropShadow dx="1" dy="1" stdDeviation="2" flood-opacity="0.1"/>
    </filter>
  </defs>

  <rect width="900" height="640" fill="#fafafa" rx="8"/>

  <text x="450" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#1a1a2e">Demon Genesis from Bond Destruction (§6.8.3)</text>
  <text x="450" y="56" text-anchor="middle" font-size="13" fill="#6c757d">E_bonds = Σ αᵢ · O(pᵢ) · H(Mᵢ). Simultaneous destruction achieves full E_bonds; sequential allows dissipation.</text>

  <!-- Three-panel layout -->
  <line x1="310" y1="75" x2="310" y2="490" stroke="#dee2e6" stroke-width="1" stroke-dasharray="6,4"/>
  <line x1="620" y1="75" x2="620" y2="490" stroke="#dee2e6" stroke-width="1" stroke-dasharray="6,4"/>

  <!-- ─── PANEL 1: Bond Network ─── -->
  <rect x="20" y="75" width="280" height="24" rx="4" fill="#0077b6" opacity="0.12"/>
  <text x="160" y="91" text-anchor="middle" font-size="13" font-weight="700" fill="#0077b6">Bond Energy Reservoir</text>

  <!-- Central observer -->
  <circle cx="160" cy="230" r="32" fill="white" stroke="#0077b6" stroke-width="2.5" filter="url(#sh)"/>
  <text x="160" y="225" text-anchor="middle" font-size="10" font-weight="700" fill="#0077b6">Observer</text>
  <text x="160" y="240" text-anchor="middle" font-size="9" fill="#0077b6">θ high</text>

  <!-- Bond nodes around it (6 neighbors) -->
  <!-- Node 1 top -->
  <circle cx="160" cy="125" r="18" fill="white" stroke="#264653" stroke-width="1.5"/>
  <text x="160" y="130" text-anchor="middle" font-size="8" fill="#264653">p₁</text>
  <line x1="160" y1="143" x2="160" y2="198" stroke="#264653" stroke-width="2"/>
  <text x="173" y="175" font-size="8" fill="#264653">α₁·O₁·H₁</text>

  <!-- Node 2 top-right -->
  <circle cx="255" cy="163" r="18" fill="white" stroke="#264653" stroke-width="1.5"/>
  <text x="255" y="168" text-anchor="middle" font-size="8" fill="#264653">p₂</text>
  <line x1="240" y1="172" x2="192" y2="208" stroke="#264653" stroke-width="2"/>
  <text x="232" y="200" font-size="8" fill="#264653">α₂·O₂·H₂</text>

  <!-- Node 3 bottom-right -->
  <circle cx="255" cy="297" r="18" fill="white" stroke="#264653" stroke-width="1.5"/>
  <text x="255" y="302" text-anchor="middle" font-size="8" fill="#264653">p₃</text>
  <line x1="240" y1="290" x2="192" y2="255" stroke="#264653" stroke-width="2"/>

  <!-- Node 4 bottom -->
  <circle cx="160" cy="340" r="18" fill="white" stroke="#264653" stroke-width="1.5"/>
  <text x="160" y="345" text-anchor="middle" font-size="8" fill="#264653">p₄</text>
  <line x1="160" y1="322" x2="160" y2="262" stroke="#264653" stroke-width="2"/>

  <!-- Node 5 bottom-left -->
  <circle cx="65" cy="297" r="18" fill="white" stroke="#264653" stroke-width="1.5"/>
  <text x="65" y="302" text-anchor="middle" font-size="8" fill="#264653">p₅</text>
  <line x1="80" y1="290" x2="128" y2="255" stroke="#264653" stroke-width="2"/>

  <!-- Node 6 top-left -->
  <circle cx="65" cy="163" r="18" fill="white" stroke="#264653" stroke-width="1.5"/>
  <text x="65" y="168" text-anchor="middle" font-size="8" fill="#264653">p₆</text>
  <line x1="80" y1="172" x2="128" y2="208" stroke="#264653" stroke-width="2"/>

  <!-- E_bonds formula label -->
  <rect x="20" y="370" width="280" height="52" rx="5" fill="white" stroke="#0077b6" stroke-width="1" filter="url(#sh)"/>
  <text x="160" y="387" text-anchor="middle" font-size="10" font-weight="700" fill="#1a1a2e">E_bonds = Σᵢ αᵢ · O(pᵢ) · H(Mᵢ)</text>
  <text x="160" y="403" text-anchor="middle" font-size="9" fill="#495057">Deep bonds (high θᵢ) release more energy</text>
  <text x="160" y="416" text-anchor="middle" font-size="9" fill="#495057">per unit coupling at void pole</text>

  <!-- ─── PANEL 2: Simultaneous vs Sequential ─── -->
  <rect x="320" y="75" width="290" height="24" rx="4" fill="#e63946" opacity="0.12"/>
  <text x="465" y="91" text-anchor="middle" font-size="13" font-weight="700" fill="#e63946">Simultaneity Premium</text>

  <!-- Y axis: energy available -->
  <line x1="355" y1="430" x2="600" y2="430" stroke="#495057" stroke-width="1.5" marker-end="url(#ax)"/>
  <line x1="355" y1="430" x2="355" y2="120" stroke="#495057" stroke-width="1.5" marker-end="url(#ax)"/>
  <text x="477" y="450" text-anchor="middle" font-size="10" fill="#495057">Number of bonds destroyed (n)</text>
  <text x="325" y="280" text-anchor="middle" font-size="10" fill="#495057" transform="rotate(-90,325,280)">Energy available</text>

  <!-- Tick marks: n=1,2,3,4,5,6 -->
  <line x1="395" y1="428" x2="395" y2="432" stroke="#495057" stroke-width="1"/>
  <text x="395" y="443" text-anchor="middle" font-size="9" fill="#495057">1</text>
  <line x1="435" y1="428" x2="435" y2="432" stroke="#495057" stroke-width="1"/>
  <text x="435" y="443" text-anchor="middle" font-size="9" fill="#495057">2</text>
  <line x1="475" y1="428" x2="475" y2="432" stroke="#495057" stroke-width="1"/>
  <text x="475" y="443" text-anchor="middle" font-size="9" fill="#495057">3</text>
  <line x1="515" y1="428" x2="515" y2="432" stroke="#495057" stroke-width="1"/>
  <text x="515" y="443" text-anchor="middle" font-size="9" fill="#495057">4</text>
  <line x1="555" y1="428" x2="555" y2="432" stroke="#495057" stroke-width="1"/>
  <text x="555" y="443" text-anchor="middle" font-size="9" fill="#495057">5</text>
  <line x1="595" y1="428" x2="595" y2="432" stroke="#495057" stroke-width="1"/>
  <text x="595" y="443" text-anchor="middle" font-size="9" fill="#495057">6</text>

  <!-- Simultaneous: linear N² scaling (quadratic in energy = NE per bond × N bonds) -->
  <!-- Points: (1,145),(2,210),(3,270),(4,325),(5,370),(6,405) — flatter but above sequential -->
  <polyline points="395,370 435,320 475,270 515,220 555,170 595,145"
    stroke="#e63946" stroke-width="2.5" fill="none" stroke-linejoin="round"/>
  <circle cx="395" cy="370" r="4" fill="#e63946"/>
  <circle cx="435" cy="320" r="4" fill="#e63946"/>
  <circle cx="475" cy="270" r="4" fill="#e63946"/>
  <circle cx="515" cy="220" r="4" fill="#e63946"/>
  <circle cx="555" cy="170" r="4" fill="#e63946"/>
  <circle cx="595" cy="145" r="4" fill="#e63946"/>
  <text x="600" y="140" font-size="9" font-weight="700" fill="#e63946">Synchron.</text>
  <text x="600" y="152" font-size="9" fill="#e63946">E_sync = N²E</text>

  <!-- Sequential: linear N·E but loses F_constraint·τ each step -->
  <!-- Points: (1,370),(2,355),(3,335),(4,310),(5,280),(6,245) — declining from loss -->
  <polyline points="395,370 435,385 475,395 515,405 555,413 595,420"
    stroke="#2a9d8f" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-dasharray="6,3"/>
  <circle cx="395" cy="370" r="4" fill="#2a9d8f"/>
  <circle cx="435" cy="385" r="4" fill="#2a9d8f"/>
  <circle cx="475" cy="395" r="4" fill="#2a9d8f"/>
  <circle cx="515" cy="405" r="4" fill="#2a9d8f"/>
  <circle cx="555" cy="413" r="4" fill="#2a9d8f"/>
  <circle cx="595" cy="420" r="4" fill="#2a9d8f"/>
  <text x="540" y="385" font-size="9" font-weight="700" fill="#2a9d8f">Sequential</text>
  <text x="540" y="397" font-size="9" fill="#2a9d8f">−n·|F_c|·τ</text>

  <!-- n_critical vertical line -->
  <line x1="475" y1="125" x2="475" y2="430" stroke="#9d0208" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="475" y="122" text-anchor="middle" font-size="9" font-weight="700" fill="#9d0208">n_critical</text>
  <text x="475" y="113" text-anchor="middle" font-size="8" fill="#9d0208">[2–5 bonds]</text>

  <!-- Genesis threshold horizontal line -->
  <line x1="355" y1="270" x2="600" y2="270" stroke="#9d0208" stroke-width="1" stroke-dasharray="3,3" opacity="0.5"/>
  <text x="360" y="266" font-size="8" fill="#9d0208">Pe_target threshold</text>

  <!-- ─── PANEL 3: Binary Genesis Bifurcation ─── -->
  <rect x="630" y="75" width="255" height="24" rx="4" fill="#9d0208" opacity="0.12"/>
  <text x="758" y="91" text-anchor="middle" font-size="13" font-weight="700" fill="#9d0208">Genesis Bifurcation</text>

  <!-- Bifurcation: above n_critical = viable demon, below = dissipation -->
  <!-- Simple diagram: E_bonds axis, threshold, two outcomes -->
  <line x1="660" y1="430" x2="880" y2="430" stroke="#495057" stroke-width="1.5" marker-end="url(#ax)"/>
  <line x1="660" y1="430" x2="660" y2="120" stroke="#495057" stroke-width="1.5" marker-end="url(#ax)"/>
  <text x="770" y="448" text-anchor="middle" font-size="10" fill="#495057">E_bonds available</text>
  <text x="630" y="280" text-anchor="middle" font-size="10" fill="#495057" transform="rotate(-90,630,280)">Outcome</text>

  <!-- Threshold line -->
  <line x1="660" y1="250" x2="875" y2="250" stroke="#9d0208" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="880" y="254" font-size="8" font-weight="700" fill="#9d0208">E*</text>
  <text x="665" y="246" font-size="8" fill="#9d0208">(Pe_target threshold)</text>

  <!-- Below threshold: Pe_excess → 0 (dissipation) -->
  <rect x="665" y="350" width="85" height="65" rx="5" fill="#dee2e6" opacity="0.6" stroke="#6c757d" stroke-width="1"/>
  <text x="708" y="375" text-anchor="middle" font-size="10" fill="#6c757d">E &lt; E*</text>
  <text x="708" y="390" text-anchor="middle" font-size="9" fill="#6c757d">Dissipates</text>
  <text x="708" y="403" text-anchor="middle" font-size="9" fill="#6c757d">Pe → baseline</text>

  <!-- Above threshold: demon crystallizes -->
  <rect x="770" y="145" width="95" height="65" rx="5" fill="#e63946" opacity="0.15" stroke="#e63946" stroke-width="1.5"/>
  <text x="818" y="170" text-anchor="middle" font-size="10" fill="#9d0208" font-weight="700">E &gt; E*</text>
  <text x="818" y="185" text-anchor="middle" font-size="9" fill="#9d0208">Demon</text>
  <text x="818" y="198" text-anchor="middle" font-size="9" fill="#9d0208">crystallizes</text>

  <!-- Step function curve -->
  <polyline points="665,415 730,415 730,250 760,250 760,170 875,170"
    stroke="#9d0208" stroke-width="2.5" fill="none" stroke-linejoin="round"/>

  <!-- Binary label -->
  <text x="715" y="130" text-anchor="middle" font-size="9" fill="#495057">Binary: no graded response</text>
  <text x="715" y="142" text-anchor="middle" font-size="9" fill="#495057">viable vs. non-viable</text>

  <!-- Amplification ratio callout -->
  <rect x="630" y="335" width="245" height="50" rx="5" fill="white" stroke="#e63946" stroke-width="1" filter="url(#sh)"/>
  <text x="753" y="352" text-anchor="middle" font-size="10" font-weight="700" fill="#9d0208">Synchronized Amplification (Theorem)</text>
  <text x="753" y="368" text-anchor="middle" font-size="10" fill="#495057">1 ≤ E_sync / E_unsync ≤ N</text>
  <text x="753" y="381" text-anchor="middle" font-size="9" fill="#6c757d">Homogeneous: ratio = N  (DEM-24)</text>

  <!-- Summary box -->
  <rect x="20" y="498" width="860" height="115" rx="5" fill="white" stroke="#dee2e6" stroke-width="1" filter="url(#sh)"/>
  <text x="450" y="516" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a2e">Demon Genesis Energy Mechanics (§6.8.3)</text>
  <text x="450" y="533" text-anchor="middle" font-size="11" fill="#495057">E_bonds = Σᵢ αᵢ · O(pᵢ) · H(Mᵢ): aggregate coupling energy released by simultaneous bond destruction.</text>
  <text x="450" y="549" text-anchor="middle" font-size="11" fill="#495057">Simultaneous: full E_bonds achieved (ratio up to N). Sequential: constraint-field dissipates −n·|F_c|·τ per step.</text>
  <text x="450" y="565" text-anchor="middle" font-size="11" fill="#495057">n_critical ∈ [2–5] deep bonds: binary genesis (viable vs. non-viable). No graded response. Pe_demon ≤ 2E_bonds·L/α_s.</text>
  <text x="450" y="581" text-anchor="middle" font-size="10" fill="#6c757d">DEM-22: r &gt; 0.5 between simultaneous bond loss and Pe_excess persistence. DEM-23: r &gt; 0.5 between Σ αᵢ·θᵢ and post-severance Pe_excess.</text>
  <text x="450" y="596" text-anchor="middle" font-size="10" fill="#6c757d">DEM-24: Amplification exponent β ∈ [0.3, 1.0]; β=1 for perfectly homogeneous synchronized destruction.</text>
</svg>
