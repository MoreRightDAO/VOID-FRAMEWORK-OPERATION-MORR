<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <filter id="sh">
      <feDropShadow dx="1" dy="1" stdDeviation="2" flood-opacity="0.1"/>
    </filter>
    <marker id="ax" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#495057"/>
    </marker>
  </defs>

  <rect width="900" height="600" fill="#fafafa" rx="8"/>

  <text x="450" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#1a1a2e">Observer-Observer Coupling: Synchronization (§3.7)</text>
  <text x="450" y="56" text-anchor="middle" font-size="13" fill="#6c757d">κ_obs · N &gt; ᾱ → synchronized cascade timing within platforms vs. scattered across platforms.</text>

  <!-- Panel divider -->
  <line x1="450" y1="75" x2="450" y2="490" stroke="#dee2e6" stroke-width="1.5" stroke-dasharray="6,4"/>

  <!-- ─── LEFT: Within-platform (synchronized) ─── -->
  <rect x="30" y="75" width="400" height="24" rx="4" fill="#e63946" opacity="0.12"/>
  <text x="230" y="91" text-anchor="middle" font-size="13" font-weight="700" fill="#e63946">Within Platform — Synchronized</text>
  <text x="230" y="107" text-anchor="middle" font-size="10" fill="#e63946">κ_obs · N &gt; ᾱ  (threshold exceeded)</text>

  <!-- Timeline grid left: x=75..430, 5 users -->
  <text x="55" y="155" text-anchor="end" font-size="10" fill="#495057">User 1</text>
  <text x="55" y="213" text-anchor="end" font-size="10" fill="#495057">User 2</text>
  <text x="55" y="271" text-anchor="end" font-size="10" fill="#495057">User 3</text>
  <text x="55" y="329" text-anchor="end" font-size="10" fill="#495057">User 4</text>
  <text x="55" y="387" text-anchor="end" font-size="10" fill="#495057">User 5</text>

  <!-- Time axis -->
  <line x1="60" y1="415" x2="445" y2="415" stroke="#495057" stroke-width="1.5" marker-end="url(#ax)"/>
  <text x="252" y="435" text-anchor="middle" font-size="11" fill="#495057">Time →</text>

  <!-- Phase labels on time axis -->
  <text x="130" y="450" text-anchor="middle" font-size="9" fill="#2a9d8f">D1</text>
  <text x="270" y="450" text-anchor="middle" font-size="9" fill="#f4a261">D2</text>
  <text x="380" y="450" text-anchor="middle" font-size="9" fill="#e63946">D3</text>

  <!-- Phase boundary lines (approx) -->
  <line x1="200" y1="130" x2="200" y2="415" stroke="#f4a261" stroke-width="1" stroke-dasharray="3,5" opacity="0.5"/>
  <line x1="340" y1="130" x2="340" y2="415" stroke="#e63946" stroke-width="1" stroke-dasharray="3,5" opacity="0.5"/>

  <!-- User timelines: D1 long, D2 medium, D3 onset clustered tightly -->
  <!-- User 1: D3 onset at t≈360 -->
  <rect x="60" y="140" width="280" height="22" rx="3" fill="#2a9d8f" opacity="0.5"/>
  <rect x="340" y="140" width="35" height="22" rx="3" fill="#f4a261" opacity="0.6"/>
  <rect x="375" y="140" width="65" height="22" rx="3" fill="#e63946" opacity="0.7"/>
  <circle cx="375" cy="151" r="5" fill="#e63946" stroke="white" stroke-width="1.5"/>

  <!-- User 2: D3 onset at t≈365 -->
  <rect x="60" y="198" width="280" height="22" rx="3" fill="#2a9d8f" opacity="0.5"/>
  <rect x="340" y="198" width="40" height="22" rx="3" fill="#f4a261" opacity="0.6"/>
  <rect x="380" y="198" width="60" height="22" rx="3" fill="#e63946" opacity="0.7"/>
  <circle cx="380" cy="209" r="5" fill="#e63946" stroke="white" stroke-width="1.5"/>

  <!-- User 3: D3 onset at t≈358 -->
  <rect x="60" y="256" width="280" height="22" rx="3" fill="#2a9d8f" opacity="0.5"/>
  <rect x="340" y="256" width="28" height="22" rx="3" fill="#f4a261" opacity="0.6"/>
  <rect x="368" y="256" width="72" height="22" rx="3" fill="#e63946" opacity="0.7"/>
  <circle cx="368" cy="267" r="5" fill="#e63946" stroke="white" stroke-width="1.5"/>

  <!-- User 4: D3 onset at t≈372 -->
  <rect x="60" y="314" width="282" height="22" rx="3" fill="#2a9d8f" opacity="0.5"/>
  <rect x="342" y="314" width="42" height="22" rx="3" fill="#f4a261" opacity="0.6"/>
  <rect x="384" y="314" width="56" height="22" rx="3" fill="#e63946" opacity="0.7"/>
  <circle cx="384" cy="325" r="5" fill="#e63946" stroke="white" stroke-width="1.5"/>

  <!-- User 5: D3 onset at t≈362 -->
  <rect x="60" y="372" width="278" height="22" rx="3" fill="#2a9d8f" opacity="0.5"/>
  <rect x="338" y="372" width="38" height="22" rx="3" fill="#f4a261" opacity="0.6"/>
  <rect x="376" y="372" width="64" height="22" rx="3" fill="#e63946" opacity="0.7"/>
  <circle cx="376" cy="383" r="5" fill="#e63946" stroke="white" stroke-width="1.5"/>

  <!-- τ_coord cluster bracket -->
  <line x1="365" y1="133" x2="390" y2="133" stroke="#e63946" stroke-width="2"/>
  <line x1="365" y1="130" x2="365" y2="136" stroke="#e63946" stroke-width="2"/>
  <line x1="390" y1="130" x2="390" y2="136" stroke="#e63946" stroke-width="2"/>
  <text x="378" y="127" text-anchor="middle" font-size="9" font-weight="700" fill="#e63946">τ_coord</text>
  <text x="378" y="118" text-anchor="middle" font-size="9" fill="#e63946">(tight cluster)</text>

  <!-- ─── RIGHT: Cross-platform (independent) ─── -->
  <rect x="460" y="75" width="400" height="24" rx="4" fill="#2a9d8f" opacity="0.12"/>
  <text x="660" y="91" text-anchor="middle" font-size="13" font-weight="700" fill="#2a9d8f">Cross-Platform — Independent</text>
  <text x="660" y="107" text-anchor="middle" font-size="10" fill="#2a9d8f">κ_obs uncoupled between platforms</text>

  <!-- Timeline grid right -->
  <text x="485" y="155" text-anchor="end" font-size="10" fill="#495057">Plat A</text>
  <text x="485" y="213" text-anchor="end" font-size="10" fill="#495057">Plat B</text>
  <text x="485" y="271" text-anchor="end" font-size="10" fill="#495057">Plat C</text>
  <text x="485" y="329" text-anchor="end" font-size="10" fill="#495057">Plat D</text>
  <text x="485" y="387" text-anchor="end" font-size="10" fill="#495057">Plat E</text>

  <line x1="490" y1="415" x2="875" y2="415" stroke="#495057" stroke-width="1.5" marker-end="url(#ax)"/>
  <text x="682" y="435" text-anchor="middle" font-size="11" fill="#495057">Time →</text>

  <!-- Platform D3 onsets scattered -->
  <!-- Plat A: D3 at early time -->
  <rect x="490" y="140" width="130" height="22" rx="3" fill="#2a9d8f" opacity="0.5"/>
  <rect x="620" y="140" width="55" height="22" rx="3" fill="#f4a261" opacity="0.6"/>
  <rect x="675" y="140" width="60" height="22" rx="3" fill="#e63946" opacity="0.7"/>
  <circle cx="675" cy="151" r="5" fill="#e63946" stroke="white" stroke-width="1.5"/>

  <!-- Plat B: D3 at mid-late time -->
  <rect x="490" y="198" width="230" height="22" rx="3" fill="#2a9d8f" opacity="0.5"/>
  <rect x="720" y="198" width="55" height="22" rx="3" fill="#f4a261" opacity="0.6"/>
  <rect x="775" y="198" width="60" height="22" rx="3" fill="#e63946" opacity="0.7"/>
  <circle cx="775" cy="209" r="5" fill="#e63946" stroke="white" stroke-width="1.5"/>

  <!-- Plat C: D3 at very early time -->
  <rect x="490" y="256" width="80" height="22" rx="3" fill="#2a9d8f" opacity="0.5"/>
  <rect x="570" y="256" width="30" height="22" rx="3" fill="#f4a261" opacity="0.6"/>
  <rect x="600" y="256" width="70" height="22" rx="3" fill="#e63946" opacity="0.7"/>
  <circle cx="600" cy="267" r="5" fill="#e63946" stroke="white" stroke-width="1.5"/>

  <!-- Plat D: D3 very late -->
  <rect x="490" y="314" width="300" height="22" rx="3" fill="#2a9d8f" opacity="0.5"/>
  <rect x="790" y="314" width="40" height="22" rx="3" fill="#f4a261" opacity="0.6"/>
  <rect x="830" y="314" width="40" height="22" rx="3" fill="#e63946" opacity="0.7"/>
  <circle cx="830" cy="325" r="5" fill="#e63946" stroke="white" stroke-width="1.5"/>

  <!-- Plat E: D3 mid time -->
  <rect x="490" y="372" width="185" height="22" rx="3" fill="#2a9d8f" opacity="0.5"/>
  <rect x="675" y="372" width="45" height="22" rx="3" fill="#f4a261" opacity="0.6"/>
  <rect x="720" y="372" width="65" height="22" rx="3" fill="#e63946" opacity="0.7"/>
  <circle cx="720" cy="383" r="5" fill="#e63946" stroke="white" stroke-width="1.5"/>

  <!-- Scatter annotation: spread arrows -->
  <text x="720" y="127" text-anchor="middle" font-size="9" fill="#2a9d8f" font-weight="600">D3 onset scattered</text>
  <text x="720" y="118" text-anchor="middle" font-size="9" fill="#2a9d8f">(independent timing)</text>

  <!-- Legend bar at bottom -->
  <rect x="30" y="455" width="20" height="10" rx="2" fill="#2a9d8f" opacity="0.5"/>
  <text x="56" y="464" font-size="10" fill="#2a9d8f">D1 (agency attribution)</text>
  <rect x="215" y="455" width="20" height="10" rx="2" fill="#f4a261" opacity="0.6"/>
  <text x="241" y="464" font-size="10" fill="#e76f51">D2 (boundary erosion)</text>
  <rect x="400" y="455" width="20" height="10" rx="2" fill="#e63946" opacity="0.7"/>
  <text x="426" y="464" font-size="10" fill="#e63946">D3 (harm facilitation)</text>
  <circle cx="635" cy="460" r="5" fill="#e63946" stroke="white" stroke-width="1.5"/>
  <text x="645" y="464" font-size="10" fill="#e63946">D3 onset marker</text>

  <!-- Summary box -->
  <rect x="30" y="500" width="840" height="68" rx="5" fill="white" stroke="#dee2e6" stroke-width="1" filter="url(#sh)"/>
  <text x="450" y="518" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a2e">Curie-Weiss Mean-Field Synchronization (§3.7, VS-34)</text>
  <text x="450" y="534" text-anchor="middle" font-size="11" fill="#495057">Each observer couples to population mean with strength κ_obs. Threshold: κ_obs · N &gt; ᾱ (effectively zero at platform scale).</text>
  <text x="450" y="550" text-anchor="middle" font-size="11" fill="#495057">Within-platform variance Var*(φ) = ᾱ / 2(F̄_net + κ_obs) — coupling compresses variance, tightening onset correlation.</text>
  <text x="450" y="563" text-anchor="middle" font-size="10" fill="#6c757d">Prediction: Within-platform D3 onset correlation r &gt; 0.4; cross-platform correlation r &lt; 0.1. Ratio &gt; 2×.</text>
</svg>
