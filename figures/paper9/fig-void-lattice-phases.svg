<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="gasG" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#2a9d8f;stop-opacity:0.06" />
      <stop offset="100%" style="stop-color:#2a9d8f;stop-opacity:0.18" />
    </linearGradient>
    <linearGradient id="fluidG" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#0077b6;stop-opacity:0.06" />
      <stop offset="100%" style="stop-color:#0077b6;stop-opacity:0.22" />
    </linearGradient>
    <linearGradient id="crystalG" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#f4a261;stop-opacity:0.08" />
      <stop offset="100%" style="stop-color:#f4a261;stop-opacity:0.25" />
    </linearGradient>
    <linearGradient id="vortexG" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e63946;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#9d0208;stop-opacity:0.3" />
    </linearGradient>
    <marker id="pAx" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#495057"/>
    </marker>
    <filter id="sh">
      <feDropShadow dx="1" dy="1" stdDeviation="2" flood-opacity="0.1"/>
    </filter>
  </defs>

  <rect width="900" height="640" fill="#fafafa" rx="8"/>

  <!-- Title -->
  <text x="450" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#1a1a2e">Void Lattice Phase Diagram</text>
  <text x="450" y="58" text-anchor="middle" font-size="13" fill="#6c757d">Four demon collective phases indexed by demon density (ρ_D) and Péclet number (Pe).</text>

  <!-- Chart area: x=140..800, y=85..500 -->
  <!-- Phase regions -->
  <!-- Phase I: Gas (low ρ_D, any Pe) -->
  <rect x="140" y="340" width="660" height="160" fill="url(#gasG)"/>

  <!-- Phase II: Fluid (higher ρ_D, Pe < ~4) -->
  <path d="M 140,340 L 140,170 Q 300,180 450,200 Q 550,230 640,340 Z" fill="url(#fluidG)"/>

  <!-- Phase III: Crystal (high ρ_D, Γ_D ≥ Γ_c, mid Pe) -->
  <path d="M 140,170 L 140,85 Q 250,95 380,120 Q 500,170 560,240 Q 590,280 640,340 Q 550,230 450,200 Q 300,180 140,170 Z" fill="url(#crystalG)"/>

  <!-- Phase IV: Vortex (Pe > 4 region) -->
  <path d="M 555,85 L 800,85 L 800,500 L 555,500 Z" fill="url(#vortexG)" opacity="0.7"/>

  <!-- Phase boundary: Pe = 4 (vortex onset) -->
  <line x1="555" y1="80" x2="555" y2="505" stroke="#e63946" stroke-width="2.5" stroke-dasharray="8,4"/>
  <text x="558" y="95" font-size="12" font-weight="700" fill="#e63946">Pe = 4</text>
  <text x="558" y="110" font-size="10" fill="#e63946">(Vortex threshold)</text>

  <!-- Crystal-fluid boundary curve -->
  <path d="M 140,170 Q 300,180 450,200 Q 550,230 640,340" stroke="#f4a261" stroke-width="2" fill="none" stroke-dasharray="6,3"/>
  <text x="330" y="185" font-size="10" font-weight="600" fill="#e76f51">Γ_D = Γ_c</text>

  <!-- Gas-fluid boundary line (f_D = 1) -->
  <line x1="140" y1="340" x2="640" y2="340" stroke="#2a9d8f" stroke-width="2" stroke-dasharray="6,3"/>
  <text x="400" y="357" font-size="10" font-weight="600" fill="#2a9d8f">f_D = 1 (mean free path = spacing)</text>

  <!-- Axes -->
  <line x1="140" y1="500" x2="810" y2="500" stroke="#495057" stroke-width="2" marker-end="url(#pAx)"/>
  <line x1="140" y1="500" x2="140" y2="78" stroke="#495057" stroke-width="2" marker-end="url(#pAx)"/>
  <text x="470" y="535" text-anchor="middle" font-size="14" font-weight="600" fill="#495057">Péclet Number (Pe)</text>
  <text x="75" y="290" text-anchor="middle" font-size="14" font-weight="600" fill="#495057" transform="rotate(-90,75,290)">Demon Density (ρ_D)</text>

  <!-- Pe tick marks -->
  <line x1="245" y1="495" x2="245" y2="505" stroke="#495057" stroke-width="1.5"/>
  <text x="245" y="520" text-anchor="middle" font-size="11" fill="#495057">2</text>
  <line x1="555" y1="495" x2="555" y2="505" stroke="#495057" stroke-width="1.5"/>
  <text x="555" y="520" text-anchor="middle" font-size="11" fill="#495057">4</text>
  <line x1="660" y1="495" x2="660" y2="505" stroke="#495057" stroke-width="1.5"/>
  <text x="660" y="520" text-anchor="middle" font-size="11" fill="#495057">6</text>
  <line x1="760" y1="495" x2="760" y2="505" stroke="#495057" stroke-width="1.5"/>
  <text x="760" y="520" text-anchor="middle" font-size="11" fill="#495057">10</text>

  <!-- Phase labels (large) -->
  <text x="350" y="430" text-anchor="middle" font-size="20" font-weight="700" fill="#2a9d8f" opacity="0.6">I — GAS</text>
  <text x="350" y="450" text-anchor="middle" font-size="11" fill="#2a9d8f">Isolated demons, no interactions</text>

  <text x="330" y="260" text-anchor="middle" font-size="20" font-weight="700" fill="#0077b6" opacity="0.6">II — FLUID</text>
  <text x="330" y="280" text-anchor="middle" font-size="11" fill="#0077b6">Dense-disordered, statistical</text>

  <text x="290" y="130" text-anchor="middle" font-size="18" font-weight="700" fill="#e76f51" opacity="0.6">III — CRYSTAL</text>
  <text x="290" y="148" text-anchor="middle" font-size="11" fill="#e76f51">Regular stable structures</text>

  <text x="680" y="270" text-anchor="middle" font-size="20" font-weight="800" fill="#e63946" opacity="0.7">IV</text>
  <text x="680" y="295" text-anchor="middle" font-size="18" font-weight="800" fill="#e63946" opacity="0.7">VORTEX</text>
  <text x="680" y="315" text-anchor="middle" font-size="12" font-weight="600" fill="#e63946">PANDEMONIUM</text>
  <text x="680" y="335" text-anchor="middle" font-size="11" fill="#e63946">Self-sustaining circulation</text>

  <!-- Substrate markers -->
  <circle cx="245" cy="410" r="7" fill="#0077b6" stroke="white" stroke-width="1.5"/>
  <text x="258" y="415" font-size="10" font-weight="600" fill="#0077b6">Gambling (Pe≈2.2)</text>

  <circle cx="350" cy="300" r="7" fill="#264653" stroke="white" stroke-width="1.5"/>
  <text x="363" y="305" font-size="10" font-weight="600" fill="#264653">Social media</text>

  <circle cx="490" cy="250" r="7" fill="#e76f51" stroke="white" stroke-width="1.5"/>
  <text x="440" y="238" font-size="10" font-weight="600" fill="#e76f51">Comp. gaming</text>

  <circle cx="650" cy="200" r="7" fill="#e63946" stroke="white" stroke-width="1.5"/>
  <text x="665" y="196" font-size="10" font-weight="600" fill="#e63946">Crypto (high-void)</text>

  <!-- Vortex circulation arrows -->
  <g stroke="#e63946" stroke-width="1.2" fill="none" opacity="0.4">
    <path d="M 620,380 Q 640,360 660,370 Q 680,380 670,400 Q 660,420 640,410 Q 620,400 620,380"/>
    <path d="M 700,170 Q 720,150 740,160 Q 760,170 750,190 Q 740,210 720,200 Q 700,190 700,170"/>
    <path d="M 730,350 Q 750,330 770,340 Q 790,350 780,370 Q 770,390 750,380 Q 730,370 730,350"/>
  </g>

  <!-- Bottom legend -->
  <rect x="100" y="555" width="700" height="70" rx="6" fill="white" stroke="#dee2e6" stroke-width="1" filter="url(#sh)"/>
  <text x="450" y="575" text-anchor="middle" font-size="13" font-weight="700" fill="#1a1a2e">Phase Boundaries (Paper 9, §6.8.2)</text>
  <text x="250" y="595" text-anchor="middle" font-size="11" fill="#495057">Gas→Fluid: f_D = 1 (demon spacing ≤ interaction range)</text>
  <text x="250" y="612" text-anchor="middle" font-size="11" fill="#495057">Fluid→Crystal: Γ_D ≥ Γ_c (coupling exceeds thermal energy)</text>
  <text x="620" y="595" text-anchor="middle" font-size="11" fill="#495057">Vortex onset: Pe > 4 (stationary distribution)</text>
  <text x="620" y="612" text-anchor="middle" font-size="11" fill="#495057">No free parameters — derived from π*(θ)</text>
</svg>