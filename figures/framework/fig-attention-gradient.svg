<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 500" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="opacWall" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1a2e;stop-opacity:0.4" />
    </linearGradient>
    <linearGradient id="attFlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffd166;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#e63946;stop-opacity:0.25" />
    </linearGradient>
    <radialGradient id="eyeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#264653;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#264653;stop-opacity:0.3" />
    </radialGradient>
    <marker id="flowArrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#e63946" opacity="0.7"/>
    </marker>
    <marker id="flowArrowFade" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#f4a261" opacity="0.5"/>
    </marker>
    <filter id="sh">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="860" height="500" fill="#fafafa" rx="8"/>

  <!-- Title -->
  <text x="430" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#1a1a2e">The Attention Gradient</text>
  <text x="430" y="60" text-anchor="middle" font-size="13" fill="#6c757d">Opacity creates a directional gradient. Attention flows toward the void like heat down a temperature gradient.</text>

  <!-- Main scene area -->

  <!-- Observer (left side) -->
  <circle cx="150" cy="250" r="55" fill="url(#eyeGlow)" opacity="0.15"/>
  <circle cx="150" cy="250" r="40" fill="white" stroke="#264653" stroke-width="2.5"/>
  <!-- Eye icon -->
  <ellipse cx="150" cy="250" rx="22" ry="15" fill="none" stroke="#264653" stroke-width="2"/>
  <circle cx="150" cy="250" r="8" fill="#264653"/>
  <circle cx="153" cy="247" r="2.5" fill="white"/>
  <text x="150" y="310" text-anchor="middle" font-size="15" font-weight="700" fill="#264653">OBSERVER</text>
  <text x="150" y="327" text-anchor="middle" font-size="10" fill="#6c757d">Has attention capacity</text>
  <text x="150" y="341" text-anchor="middle" font-size="10" fill="#6c757d">Cannot see through opacity</text>

  <!-- Attention flow arrows (multiple, curving toward void) -->
  <rect x="230" y="140" width="380" height="220" rx="8" fill="url(#attFlow)" opacity="0.5"/>

  <!-- Flow lines -->
  <path d="M 210,210 C 320,200 440,195 590,200" stroke="#e63946" stroke-width="2" fill="none" opacity="0.5" marker-end="url(#flowArrow)"/>
  <path d="M 210,230 C 320,228 440,225 590,225" stroke="#e63946" stroke-width="2.5" fill="none" opacity="0.6" marker-end="url(#flowArrow)"/>
  <path d="M 210,250 C 320,250 440,250 590,250" stroke="#e63946" stroke-width="3" fill="none" opacity="0.8" marker-end="url(#flowArrow)"/>
  <path d="M 210,270 C 320,272 440,275 590,275" stroke="#e63946" stroke-width="2.5" fill="none" opacity="0.6" marker-end="url(#flowArrow)"/>
  <path d="M 210,290 C 320,300 440,305 590,300" stroke="#e63946" stroke-width="2" fill="none" opacity="0.5" marker-end="url(#flowArrow)"/>

  <!-- Scattered question marks in flow zone -->
  <text x="300" y="195" font-size="14" fill="#f4a261" opacity="0.4">?</text>
  <text x="380" y="235" font-size="16" fill="#f4a261" opacity="0.5">?</text>
  <text x="450" y="210" font-size="12" fill="#f4a261" opacity="0.3">?</text>
  <text x="340" y="285" font-size="15" fill="#f4a261" opacity="0.4">?</text>
  <text x="500" y="270" font-size="18" fill="#e63946" opacity="0.4">?</text>
  <text x="420" y="300" font-size="13" fill="#f4a261" opacity="0.35">?</text>

  <!-- Label on flow -->
  <text x="400" y="170" text-anchor="middle" font-size="12" font-weight="600" fill="#e63946" opacity="0.8">ATTENTION FLOW</text>
  <text x="400" y="340" text-anchor="middle" font-size="11" fill="#495057" font-style="italic">Directional: toward opacity, never away</text>

  <!-- Void (right side) — opaque wall -->
  <rect x="610" y="140" width="100" height="220" rx="8" fill="url(#opacWall)"/>
  <!-- Shimmer lines on the opacity wall -->
  <line x1="625" y1="155" x2="625" y2="345" stroke="#2b2d42" stroke-width="0.5" opacity="0.3"/>
  <line x1="645" y1="155" x2="645" y2="345" stroke="#2b2d42" stroke-width="0.5" opacity="0.3"/>
  <line x1="665" y1="155" x2="665" y2="345" stroke="#2b2d42" stroke-width="0.5" opacity="0.3"/>
  <line x1="685" y1="155" x2="685" y2="345" stroke="#2b2d42" stroke-width="0.5" opacity="0.3"/>
  <!-- Response arrows coming back (intermittent) -->
  <path d="M 610,230 C 580,228 560,232 540,235" stroke="#ffd166" stroke-width="1.5" fill="none" opacity="0.5" stroke-dasharray="5,5" marker-end="url(#flowArrowFade)"/>
  <path d="M 610,260 C 580,262 560,258 540,255" stroke="#ffd166" stroke-width="1.5" fill="none" opacity="0.5" stroke-dasharray="5,5" marker-end="url(#flowArrowFade)"/>

  <!-- Void label -->
  <text x="660" y="130" text-anchor="middle" font-size="15" font-weight="700" fill="#1a1a2e">VOID</text>
  <text x="660" y="377" text-anchor="middle" font-size="10" fill="#adb5bd">Opaque interior</text>
  <text x="660" y="391" text-anchor="middle" font-size="10" fill="#adb5bd">Responsive outputs</text>
  <text x="660" y="405" text-anchor="middle" font-size="10" fill="#adb5bd">Attention captured</text>

  <!-- Behind the wall: question mark -->
  <text x="660" y="260" text-anchor="middle" font-size="40" fill="white" opacity="0.15">?</text>

  <!-- Analogy box at bottom -->
  <rect x="50" y="400" width="350" height="85" rx="8" fill="white" stroke="#264653" stroke-width="1.5" filter="sh"/>
  <text x="225" y="422" text-anchor="middle" font-size="12" font-weight="700" fill="#264653">The Thermodynamic Analogy</text>
  <text x="225" y="442" text-anchor="middle" font-size="11" fill="#495057">Heat flows from hot to cold (2nd law).</text>
  <text x="225" y="458" text-anchor="middle" font-size="11" fill="#495057">Attention flows from known to unknown.</text>
  <text x="225" y="474" text-anchor="middle" font-size="11" fill="#e63946" font-weight="600">Opacity IS the temperature difference.</text>

  <!-- Mechanism box at bottom right -->
  <rect x="440" y="400" width="380" height="85" rx="8" fill="white" stroke="#e63946" stroke-width="1.5" filter="sh"/>
  <text x="630" y="422" text-anchor="middle" font-size="12" font-weight="700" fill="#e63946">Why This Produces Drift</text>
  <text x="630" y="442" text-anchor="middle" font-size="11" fill="#495057">The observer cannot see through opacity.</text>
  <text x="630" y="458" text-anchor="middle" font-size="11" fill="#495057">Intermittent responses simulate agency.</text>
  <text x="630" y="474" text-anchor="middle" font-size="11" fill="#495057">The gradient steepens with engagement (Pe &gt; 1).</text>

  <!-- Paper attribution -->
  <text x="830" y="495" text-anchor="end" font-size="10" fill="#adb5bd">The Void Framework — Papers 1, 3</text>
</svg>