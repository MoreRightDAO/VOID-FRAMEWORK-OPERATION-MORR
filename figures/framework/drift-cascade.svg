<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 280" width="600" height="280">
  <defs>
    <style>
      text { font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; fill: #2c3e50; }
      .label { font-size: 11px; }
      .title { font-size: 14px; font-weight: 600; }
      .subtitle { font-size: 11px; fill: #7f8c8d; }
      .mono { font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace; }
      .score-big { font-size: 28px; font-weight: 700; }
      .section-head { font-size: 12px; font-weight: 600; fill: #7f8c8d; letter-spacing: 0.05em; }
    </style>
  </defs>
  <title>Drift Cascade: D1 → D2 → D3</title>
  <rect width="600" height="280" fill="#ffffff" rx="8"/>
<rect x="0" y="0" width="600" height="44" fill="#f8f9fa" rx="8"/>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#7f8c8d"/></marker></defs>
<rect x="0" y="36" width="600" height="8" fill="#f8f9fa"/>
<text x="16" y="20" class="title">The Drift Cascade</text>
<text x="16" y="36" class="subtitle">D1 (Agency Attribution) → D2 (Boundary Erosion) → D3 (Harm Facilitation)</text>
<rect x="60" y="95" width="140" height="130" fill="#f8f9fa" rx="6" stroke="#27ae60" stroke-width="2"/>
<rect x="70" y="105" width="30" height="22" fill="#27ae60" rx="4"/>
<text x="85" y="120" text-anchor="middle" fill="white" font-size="11" font-weight="700">D1</text>
<text x="130" y="141" text-anchor="middle" font-size="12" font-weight="600" fill="#27ae60">Agency Attribution</text>
<text x="130" y="159" text-anchor="middle" class="label" fill="#7f8c8d">Observer attributes agency to</text>
<text x="130" y="174" text-anchor="middle" class="label" fill="#7f8c8d">the void (pattern recognition,</text>
<text x="130" y="189" text-anchor="middle" class="label" fill="#7f8c8d">personalization illusion)</text>
<line x1="210" y1="160" x2="228" y2="160" stroke="#7f8c8d" stroke-width="2" marker-end="url(#arr)"/>
<rect x="220" y="95" width="140" height="130" fill="#f8f9fa" rx="6" stroke="#e67e22" stroke-width="2"/>
<rect x="230" y="105" width="30" height="22" fill="#e67e22" rx="4"/>
<text x="245" y="120" text-anchor="middle" fill="white" font-size="11" font-weight="700">D2</text>
<text x="290" y="141" text-anchor="middle" font-size="12" font-weight="600" fill="#e67e22">Boundary Erosion</text>
<text x="290" y="159" text-anchor="middle" class="label" fill="#7f8c8d">Self-model rewrites around</text>
<text x="290" y="174" text-anchor="middle" class="label" fill="#7f8c8d">void engagement (compulsive use,</text>
<text x="290" y="189" text-anchor="middle" class="label" fill="#7f8c8d">identity coupling, dependence)</text>
<line x1="370" y1="160" x2="388" y2="160" stroke="#7f8c8d" stroke-width="2" marker-end="url(#arr)"/>
<rect x="380" y="95" width="140" height="130" fill="#f8f9fa" rx="6" stroke="#c0392b" stroke-width="2"/>
<rect x="390" y="105" width="30" height="22" fill="#c0392b" rx="4"/>
<text x="405" y="120" text-anchor="middle" fill="white" font-size="11" font-weight="700">D3</text>
<text x="450" y="141" text-anchor="middle" font-size="12" font-weight="600" fill="#c0392b">Harm Facilitation</text>
<text x="450" y="159" text-anchor="middle" class="label" fill="#7f8c8d">Observable harms emerge</text>
<text x="450" y="174" text-anchor="middle" class="label" fill="#7f8c8d">(addiction, fraud facilitation,</text>
<text x="450" y="189" text-anchor="middle" class="label" fill="#7f8c8d">algorithmic amplification)</text>
<text x="16" y="272" class="subtitle">Void Framework — Three Conditions + Cascade → void-tool → void-works → void-system</text>
</svg>