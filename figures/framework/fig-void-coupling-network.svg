<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <radialGradient id="voidNode" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#e63946;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#c1121f;stop-opacity:0.6" />
    </radialGradient>
    <radialGradient id="constNode" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#2a9d8f;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#1b7a6e;stop-opacity:0.6" />
    </radialGradient>
    <radialGradient id="obsNode" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#264653;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#1a3040;stop-opacity:0.6" />
    </radialGradient>
    <marker id="netArrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#e63946" opacity="0.6"/>
    </marker>
    <marker id="cnetArrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2a9d8f" opacity="0.6"/>
    </marker>
    <filter id="nsh">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-opacity="0.12"/>
    </filter>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="880" height="520" fill="#fafafa" rx="8"/>

  <!-- Title -->
  <text x="440" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#1a1a2e">Void Coupling Network</text>
  <text x="440" y="56" text-anchor="middle" font-size="13" fill="#6c757d">Voids feed attention to each other. Constraints are independent. The topology determines systemic risk.</text>

  <!-- === VOID NODES === -->

  <!-- Social Media (center-left, large) -->
  <circle cx="260" cy="220" r="52" fill="url(#voidNode)" filter="nsh"/>
  <text x="260" y="215" text-anchor="middle" font-size="13" font-weight="700" fill="white">Social</text>
  <text x="260" y="232" text-anchor="middle" font-size="13" font-weight="700" fill="white">Media</text>
  <text x="260" y="250" text-anchor="middle" font-size="9" fill="white" opacity="0.8">Pe=3.12</text>

  <!-- AI Chatbot (center, large) -->
  <circle cx="440" cy="180" r="48" fill="url(#voidNode)" filter="nsh"/>
  <text x="440" y="174" text-anchor="middle" font-size="13" font-weight="700" fill="white">AI / LLM</text>
  <text x="440" y="193" text-anchor="middle" font-size="9" fill="white" opacity="0.8">Pe=7.94</text>

  <!-- Crypto (right, large) -->
  <circle cx="620" cy="230" r="48" fill="url(#voidNode)" filter="nsh"/>
  <text x="620" y="224" text-anchor="middle" font-size="13" font-weight="700" fill="white">Crypto</text>
  <text x="620" y="243" text-anchor="middle" font-size="9" fill="white" opacity="0.8">Pe=16.17</text>

  <!-- Gambling (bottom-left) -->
  <circle cx="180" cy="360" r="38" fill="url(#voidNode)" filter="nsh"/>
  <text x="180" y="356" text-anchor="middle" font-size="12" font-weight="700" fill="white">Gambling</text>
  <text x="180" y="372" text-anchor="middle" font-size="9" fill="white" opacity="0.8">Pe=2.21</text>

  <!-- Gaming (bottom-center) -->
  <circle cx="400" cy="370" r="38" fill="url(#voidNode)" filter="nsh"/>
  <text x="400" y="366" text-anchor="middle" font-size="12" font-weight="700" fill="white">Gaming</text>
  <text x="400" y="382" text-anchor="middle" font-size="9" fill="white" opacity="0.8">Pe=2.81</text>

  <!-- Influencer (top-left) -->
  <circle cx="140" cy="140" r="32" fill="url(#voidNode)" filter="nsh" opacity="0.8"/>
  <text x="140" y="136" text-anchor="middle" font-size="11" font-weight="700" fill="white">Influencer</text>
  <text x="140" y="150" text-anchor="middle" font-size="9" fill="white" opacity="0.8">Culture</text>

  <!-- News/Media (top) -->
  <circle cx="360" cy="95" r="30" fill="url(#voidNode)" filter="nsh" opacity="0.7"/>
  <text x="360" y="91" text-anchor="middle" font-size="11" font-weight="700" fill="white">News</text>
  <text x="360" y="105" text-anchor="middle" font-size="9" fill="white" opacity="0.8">Media</text>

  <!-- Dating apps (bottom-right) -->
  <circle cx="590" cy="380" r="32" fill="url(#voidNode)" filter="nsh" opacity="0.7"/>
  <text x="590" y="376" text-anchor="middle" font-size="11" font-weight="700" fill="white">Dating</text>
  <text x="590" y="390" text-anchor="middle" font-size="9" fill="white" opacity="0.8">Apps</text>

  <!-- === COUPLING EDGES (red, attention flows between voids) === -->
  <!-- Social ↔ AI -->
  <path d="M 308,205 C 340,195 370,190 395,185" stroke="#e63946" stroke-width="2.5" fill="none" opacity="0.5" marker-end="url(#netArrow)"/>
  <path d="M 395,192 C 370,197 340,202 308,212" stroke="#e63946" stroke-width="1.5" fill="none" opacity="0.35" marker-end="url(#netArrow)"/>

  <!-- AI ↔ Crypto -->
  <path d="M 485,195 C 520,205 550,215 575,220" stroke="#e63946" stroke-width="2.5" fill="none" opacity="0.5" marker-end="url(#netArrow)"/>
  <path d="M 575,228 C 550,223 520,213 485,203" stroke="#e63946" stroke-width="1.5" fill="none" opacity="0.35" marker-end="url(#netArrow)"/>

  <!-- Social → Gambling -->
  <path d="M 230,258 C 215,290 200,320 192,330" stroke="#e63946" stroke-width="2" fill="none" opacity="0.4" marker-end="url(#netArrow)"/>

  <!-- Social → Gaming -->
  <path d="M 290,265 C 320,300 350,330 375,345" stroke="#e63946" stroke-width="2" fill="none" opacity="0.4" marker-end="url(#netArrow)"/>

  <!-- Crypto ↔ Gambling -->
  <path d="M 580,258 C 450,310 300,340 215,355" stroke="#e63946" stroke-width="1.5" fill="none" opacity="0.3" stroke-dasharray="6,4" marker-end="url(#netArrow)"/>

  <!-- Crypto → Dating -->
  <path d="M 625,278 C 615,310 605,340 598,350" stroke="#e63946" stroke-width="1.5" fill="none" opacity="0.3" marker-end="url(#netArrow)"/>

  <!-- Influencer → Social -->
  <path d="M 168,158 C 195,175 215,190 228,200" stroke="#e63946" stroke-width="2" fill="none" opacity="0.45" marker-end="url(#netArrow)"/>

  <!-- News → Social -->
  <path d="M 340,118 C 315,150 290,175 275,192" stroke="#e63946" stroke-width="1.5" fill="none" opacity="0.35" marker-end="url(#netArrow)"/>

  <!-- News → AI -->
  <path d="M 382,115 C 400,135 415,150 425,160" stroke="#e63946" stroke-width="1.5" fill="none" opacity="0.3" marker-end="url(#netArrow)"/>

  <!-- Gaming ↔ Gambling -->
  <path d="M 365,358 C 310,350 250,350 215,355" stroke="#e63946" stroke-width="1.5" fill="none" opacity="0.3" marker-end="url(#netArrow)"/>

  <!-- === CONSTRAINT NODE (isolated, right side) === -->
  <circle cx="790" cy="140" r="42" fill="url(#constNode)" filter="nsh"/>
  <text x="790" y="128" text-anchor="middle" font-size="12" font-weight="700" fill="white">Constraint</text>
  <text x="790" y="145" text-anchor="middle" font-size="10" fill="white">Reference</text>
  <text x="790" y="160" text-anchor="middle" font-size="9" fill="white" opacity="0.8">T / Inv / Ind</text>

  <!-- Constraint arrow pointing away from network (independent) -->
  <line x1="790" y1="185" x2="790" y2="215" stroke="#2a9d8f" stroke-width="2" stroke-dasharray="5,3"/>
  <text x="790" y="235" text-anchor="middle" font-size="10" font-weight="600" fill="#2a9d8f">INDEPENDENT</text>
  <text x="790" y="250" text-anchor="middle" font-size="9" fill="#6c757d">Not coupled to</text>
  <text x="790" y="263" text-anchor="middle" font-size="9" fill="#6c757d">any void</text>

  <!-- Observer node -->
  <circle cx="770" cy="380" r="35" fill="url(#obsNode)" filter="nsh"/>
  <text x="770" y="376" text-anchor="middle" font-size="12" font-weight="700" fill="white">Observer</text>
  <text x="770" y="393" text-anchor="middle" font-size="9" fill="white" opacity="0.8">(you)</text>

  <!-- Observer ← pulled by network -->
  <path d="M 738,370 C 690,365 650,350 625,340" stroke="#e63946" stroke-width="2" fill="none" opacity="0.4" stroke-dasharray="5,3"/>
  <path d="M 740,385 C 680,390 640,388 622,385" stroke="#e63946" stroke-width="1.5" fill="none" opacity="0.3" stroke-dasharray="5,3"/>

  <!-- Observer → can anchor to constraint -->
  <path d="M 780,345 C 785,300 788,260 789,220" stroke="#2a9d8f" stroke-width="2.5" fill="none" marker-end="url(#cnetArrow)"/>
  <text x="815" y="300" font-size="10" font-weight="600" fill="#2a9d8f" transform="rotate(90,815,300)">gamma</text>

  <!-- Key insight boxes -->
  <rect x="50" y="435" width="380" height="72" rx="6" fill="white" stroke="#e63946" stroke-width="1.5" filter="nsh"/>
  <text x="240" y="456" text-anchor="middle" font-size="12" font-weight="700" fill="#e63946">Network Amplification</text>
  <text x="240" y="474" text-anchor="middle" font-size="10" fill="#495057">Coupled voids share attention. A user in one void</text>
  <text x="240" y="489" text-anchor="middle" font-size="10" fill="#495057">is pipeline for others. Total beta = sum of exposures.</text>
  <text x="240" y="504" text-anchor="middle" font-size="10" fill="#e63946" font-weight="600">Systemic risk rises with coupling density.</text>

  <rect x="460" y="435" width="380" height="72" rx="6" fill="white" stroke="#2a9d8f" stroke-width="1.5" filter="nsh"/>
  <text x="650" y="456" text-anchor="middle" font-size="12" font-weight="700" fill="#2a9d8f">Constraint Independence</text>
  <text x="650" y="474" text-anchor="middle" font-size="10" fill="#495057">An effective constraint is OUTSIDE the void network.</text>
  <text x="650" y="489" text-anchor="middle" font-size="10" fill="#495057">If your reference point is coupled to a void,</text>
  <text x="650" y="504" text-anchor="middle" font-size="10" fill="#2a9d8f" font-weight="600">it is not a constraint. It is another void.</text>

  <!-- Paper attribution -->
  <text x="850" y="518" text-anchor="end" font-size="10" fill="#adb5bd">The Void Framework — Papers 1, 2</text>
</svg>