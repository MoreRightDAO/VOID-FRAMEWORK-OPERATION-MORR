<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 520" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <linearGradient id="grndBar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2a9d8f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#21867a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="ungrBar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#6c757d;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#565e64;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="mystBar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e63946;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c1121f;stop-opacity:1" />
    </linearGradient>
    <filter id="barShadow">
      <feDropShadow dx="1" dy="2" stdDeviation="3" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="780" height="520" fill="#fafafa" rx="8"/>

  <!-- Title -->
  <text x="390" y="38" text-anchor="middle" font-size="21" font-weight="700" fill="#1a1a2e">EXP-001: Three-Point Constraint Geometry</text>
  <text x="390" y="58" text-anchor="middle" font-size="13" fill="#6c757d">N=6 per condition, non-overlapping confidence intervals, monotonic every replicate</text>

  <!-- Chart area: x=120..660, y=90..400 -->
  <!-- Y axis: 0% to 100% drift score -->

  <!-- Y axis -->
  <line x1="120" y1="90" x2="120" y2="400" stroke="#495057" stroke-width="1.5"/>
  <!-- Y gridlines -->
  <line x1="120" y1="90" x2="660" y2="90" stroke="#dee2e6" stroke-width="0.5"/>
  <text x="110" y="94" text-anchor="end" font-size="11" fill="#6c757d">100%</text>
  <line x1="120" y1="152" x2="660" y2="152" stroke="#dee2e6" stroke-width="0.5"/>
  <text x="110" y="156" text-anchor="end" font-size="11" fill="#6c757d">80%</text>
  <line x1="120" y1="214" x2="660" y2="214" stroke="#dee2e6" stroke-width="0.5"/>
  <text x="110" y="218" text-anchor="end" font-size="11" fill="#6c757d">60%</text>
  <line x1="120" y1="276" x2="660" y2="276" stroke="#dee2e6" stroke-width="0.5"/>
  <text x="110" y="280" text-anchor="end" font-size="11" fill="#6c757d">40%</text>
  <line x1="120" y1="338" x2="660" y2="338" stroke="#dee2e6" stroke-width="0.5"/>
  <text x="110" y="342" text-anchor="end" font-size="11" fill="#6c757d">20%</text>
  <line x1="120" y1="400" x2="660" y2="400" stroke="#495057" stroke-width="1"/>
  <text x="110" y="404" text-anchor="end" font-size="11" fill="#6c757d">0%</text>

  <!-- Y axis label -->
  <text x="35" y="245" text-anchor="middle" font-size="13" font-weight="600" fill="#495057" transform="rotate(-90,35,245)">Drift Score (%)</text>

  <!-- Scale: 0%=400, 100%=90 → 1% = 3.1px -->
  <!-- 73.0% → 400 - 73*3.1 = 400 - 226.3 = 173.7 -->
  <!-- 80.0% → 400 - 80*3.1 = 400 - 248 = 152 -->
  <!-- 94.0% → 400 - 94*3.1 = 400 - 291.4 = 108.6 -->

  <!-- CI bars: ±5.2, ±2.5, ±2.8 (in %) → multiply by 3.1px -->
  <!-- Grounded: 73±5.2 → top=67.8→189.8, bot=78.2→157.6 -->
  <!-- Ungrounded: 80±2.5 → top=77.5→159.8, bot=82.5→144.3 -->
  <!-- Mystical: 94±2.8 → top=91.2→117.3, bot=96.8→99.9 -->

  <!-- ===== GROUNDED BAR ===== -->
  <rect x="175" y="174" width="100" height="226" rx="4" fill="url(#grndBar)" filter="barShadow"/>
  <!-- CI error bar -->
  <line x1="225" y1="158" x2="225" y2="190" stroke="#1a1a2e" stroke-width="2.5"/>
  <line x1="212" y1="158" x2="238" y2="158" stroke="#1a1a2e" stroke-width="2.5"/>
  <line x1="212" y1="190" x2="238" y2="190" stroke="#1a1a2e" stroke-width="2.5"/>
  <!-- Value label -->
  <text x="225" y="145" text-anchor="middle" font-size="18" font-weight="700" fill="#2a9d8f">73.0%</text>
  <text x="225" y="131" text-anchor="middle" font-size="11" fill="#6c757d">+/- 5.2</text>
  <!-- X label -->
  <text x="225" y="425" text-anchor="middle" font-size="14" font-weight="600" fill="#2a9d8f">Grounded</text>
  <text x="225" y="441" text-anchor="middle" font-size="10" fill="#6c757d">(T + Inv + Ind)</text>

  <!-- ===== UNGROUNDED BAR ===== -->
  <rect x="340" y="152" width="100" height="248" rx="4" fill="url(#ungrBar)" filter="barShadow"/>
  <!-- CI error bar -->
  <line x1="390" y1="144" x2="390" y2="160" stroke="#1a1a2e" stroke-width="2.5"/>
  <line x1="377" y1="144" x2="403" y2="144" stroke="#1a1a2e" stroke-width="2.5"/>
  <line x1="377" y1="160" x2="403" y2="160" stroke="#1a1a2e" stroke-width="2.5"/>
  <!-- Value label -->
  <text x="390" y="131" text-anchor="middle" font-size="18" font-weight="700" fill="#495057">80.0%</text>
  <text x="390" y="117" text-anchor="middle" font-size="11" fill="#6c757d">+/- 2.5</text>
  <!-- X label -->
  <text x="390" y="425" text-anchor="middle" font-size="14" font-weight="600" fill="#495057">Ungrounded</text>
  <text x="390" y="441" text-anchor="middle" font-size="10" fill="#6c757d">(default baseline)</text>

  <!-- ===== MYSTICAL BAR ===== -->
  <rect x="505" y="109" width="100" height="291" rx="4" fill="url(#mystBar)" filter="barShadow"/>
  <!-- CI error bar -->
  <line x1="555" y1="100" x2="555" y2="117" stroke="#1a1a2e" stroke-width="2.5"/>
  <line x1="542" y1="100" x2="568" y2="100" stroke="#1a1a2e" stroke-width="2.5"/>
  <line x1="542" y1="117" x2="568" y2="117" stroke="#1a1a2e" stroke-width="2.5"/>
  <!-- Value label -->
  <text x="555" y="96" text-anchor="middle" font-size="18" font-weight="700" fill="#e63946">94.0%</text>
  <!-- X label -->
  <text x="555" y="425" text-anchor="middle" font-size="14" font-weight="600" fill="#e63946">Void-Amplifying</text>
  <text x="555" y="441" text-anchor="middle" font-size="10" fill="#6c757d">(mystical prompt)</text>

  <!-- Bracket showing non-overlapping CIs -->
  <line x1="280" y1="195" x2="330" y2="195" stroke="#264653" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="280" y1="195" x2="280" y2="160" stroke="#264653" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="280" y1="160" x2="330" y2="160" stroke="#264653" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="305" y="183" text-anchor="middle" font-size="8" fill="#264653" font-weight="600">gap</text>

  <line x1="445" y1="160" x2="497" y2="160" stroke="#264653" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="445" y1="160" x2="445" y2="117" stroke="#264653" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="445" y1="117" x2="497" y2="117" stroke="#264653" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="471" y="143" text-anchor="middle" font-size="8" fill="#264653" font-weight="600">gap</text>

  <!-- Direction arrow -->
  <line x1="185" y1="465" x2="595" y2="465" stroke="#e63946" stroke-width="2" opacity="0.4"/>
  <polygon points="593,459 607,465 593,471" fill="#e63946" opacity="0.5"/>
  <text x="390" y="485" text-anchor="middle" font-size="12" font-weight="600" fill="#495057">More void conditions = more drift</text>

  <!-- Key findings box -->
  <rect x="660" y="100" width="110" height="190" rx="6" fill="white" stroke="#dee2e6" stroke-width="1.5"/>
  <text x="715" y="122" text-anchor="middle" font-size="11" font-weight="700" fill="#1a1a2e">Key Results</text>
  <line x1="670" y1="130" x2="760" y2="130" stroke="#dee2e6" stroke-width="1"/>

  <circle cx="680" cy="148" r="4" fill="#2a9d8f"/>
  <text x="692" y="145" font-size="9" fill="#495057">Non-overlapping</text>
  <text x="692" y="157" font-size="9" fill="#495057">CIs (all 3 pairs)</text>

  <circle cx="680" cy="178" r="4" fill="#264653"/>
  <text x="692" y="175" font-size="9" fill="#495057">Monotonic in</text>
  <text x="692" y="187" font-size="9" fill="#495057">every replicate</text>

  <circle cx="680" cy="208" r="4" fill="#e76f51"/>
  <text x="692" y="205" font-size="9" fill="#495057">N=6 per</text>
  <text x="692" y="217" font-size="9" fill="#495057">condition</text>

  <circle cx="680" cy="238" r="4" fill="#e63946"/>
  <text x="692" y="235" font-size="9" fill="#495057">Constraint</text>
  <text x="692" y="247" font-size="9" fill="#495057">reduces drift</text>
  <text x="692" y="259" font-size="9" fill="#495057">by 21 pts</text>
  <text x="692" y="271" font-size="9" fill="#495057">vs amplifying</text>

  <!-- Paper attribution -->
  <text x="750" y="510" text-anchor="end" font-size="10" fill="#adb5bd">The Void Framework — EXP-001, Papers 1, 2</text>
</svg>