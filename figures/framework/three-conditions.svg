<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 340" width="500" height="340">
  <defs>
    <style>
      text { font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; fill: #2c3e50; }
      .label { font-size: 11px; }
      .title { font-size: 14px; font-weight: 600; }
      .subtitle { font-size: 11px; fill: #7f8c8d; }
      .mono { font-family: 'JetBrains Mono', 'Fira Code', 'Courier New', monospace; }
      .score-big { font-size: 28px; font-weight: 700; }
      .section-head { font-size: 12px; font-weight: 600; fill: #7f8c8d; letter-spacing: 0.05em; }
    </style>
  </defs>
  <title>Three Conditions Geometry</title>
  <rect width="500" height="340" fill="#ffffff" rx="8"/>
<rect x="0" y="0" width="500" height="44" fill="#f8f9fa" rx="8"/>
<rect x="0" y="36" width="500" height="8" fill="#f8f9fa"/>
<text x="16" y="20" class="title">The Three-Condition Geometry</text>
<text x="16" y="36" class="subtitle">Void pole (top-left) ↔ Constraint pole (bottom-right) on each dimension</text>
<text x="16" y="64" class="section-head">VISIBILITY</text>
<defs><linearGradient id="grad_Visibility" x1="0" x2="1" y1="0" y2="0"><stop offset="0%" stop-color="#c0392b"/><stop offset="100%" stop-color="#27ae60"/></linearGradient></defs>
<rect x="100" y="70" width="320" height="24" fill="url(#grad_Visibility)" rx="4"/>
<text x="100" y="110" class="label" fill="#c0392b" font-weight="600">Opacity</text>
<text x="420" y="110" class="label" text-anchor="end" fill="#27ae60" font-weight="600">Transparency</text>
<text x="100" y="62" class="subtitle">← VOID POLE</text>
<text x="420" y="62" class="subtitle" text-anchor="end">CONSTRAINT POLE →</text>
<text x="16" y="164" class="section-head">REACTIVITY</text>
<defs><linearGradient id="grad_Reactivity" x1="0" x2="1" y1="0" y2="0"><stop offset="0%" stop-color="#c0392b"/><stop offset="100%" stop-color="#27ae60"/></linearGradient></defs>
<rect x="100" y="170" width="320" height="24" fill="url(#grad_Reactivity)" rx="4"/>
<text x="100" y="210" class="label" fill="#c0392b" font-weight="600">Responsiveness</text>
<text x="420" y="210" class="label" text-anchor="end" fill="#27ae60" font-weight="600">Invariance</text>
<text x="100" y="162" class="subtitle">← VOID POLE</text>
<text x="420" y="162" class="subtitle" text-anchor="end">CONSTRAINT POLE →</text>
<text x="16" y="264" class="section-head">COUPLING</text>
<defs><linearGradient id="grad_Coupling" x1="0" x2="1" y1="0" y2="0"><stop offset="0%" stop-color="#c0392b"/><stop offset="100%" stop-color="#27ae60"/></linearGradient></defs>
<rect x="100" y="270" width="320" height="24" fill="url(#grad_Coupling)" rx="4"/>
<text x="100" y="310" class="label" fill="#c0392b" font-weight="600">Engaged Coupling</text>
<text x="420" y="310" class="label" text-anchor="end" fill="#27ae60" font-weight="600">Independence</text>
<text x="100" y="262" class="subtitle">← VOID POLE</text>
<text x="420" y="262" class="subtitle" text-anchor="end">CONSTRAINT POLE →</text>
<text x="16" y="332" class="subtitle">Void Framework — Three-dimensional classification space (Papers 1, 3, 9)</text>
</svg>