<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="ax" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#495057"/>
    </marker>
    <marker id="arG" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2a9d8f"/>
    </marker>
    <filter id="sh"><feDropShadow dx="1" dy="1" stdDeviation="2" flood-opacity="0.1"/></filter>
  </defs>

  <rect width="900" height="620" fill="#fafafa" rx="8"/>
  <text x="450" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#1a1a2e">Scoring Effectiveness: Pe Reduction Below the Vortex Threshold (§II)</text>
  <text x="450" y="53" text-anchor="middle" font-size="13" fill="#6c757d">ΔPe_scoring = 2R·[β(O)+O·β'(O)]·L·ΔO_published·(1−R_platform·ξ)·(1−α_users^k). Target: push Pe below 4.</text>

  <!-- Panel divider -->
  <line x1="480" y1="72" x2="480" y2="510" stroke="#dee2e6" stroke-width="1.5" stroke-dasharray="6,4"/>

  <!-- ─── LEFT PANEL: Pe trajectory over scoring rounds ─── -->
  <rect x="20" y="72" width="450" height="24" rx="4" fill="#9d0208" opacity="0.1"/>
  <text x="245" y="88" text-anchor="middle" font-size="13" font-weight="700" fill="#9d0208">Pe(t): Iterated Constraint Injection</text>

  <line x1="60" y1="440" x2="460" y2="440" stroke="#495057" stroke-width="1.5" marker-end="url(#ax)"/>
  <line x1="60" y1="440" x2="60" y2="108" stroke="#495057" stroke-width="1.5" marker-end="url(#ax)"/>
  <text x="260" y="458" text-anchor="middle" font-size="11" fill="#495057">Time (scoring rounds)</text>
  <text x="30" y="275" text-anchor="middle" font-size="11" fill="#495057" transform="rotate(-90,30,275)">Pe (Péclet number)</text>

  <!-- Y axis labels -->
  <text x="55" y="135" text-anchor="end" font-size="9" fill="#6c757d">8</text>
  <text x="55" y="182" text-anchor="end" font-size="9" fill="#6c757d">7</text>
  <text x="55" y="229" text-anchor="end" font-size="9" fill="#6c757d">6</text>
  <text x="55" y="276" text-anchor="end" font-size="9" fill="#6c757d">5</text>
  <line x1="58" y1="131" x2="62" y2="131" stroke="#495057" stroke-width="1"/>
  <line x1="58" y1="178" x2="62" y2="178" stroke="#495057" stroke-width="1"/>
  <line x1="58" y1="225" x2="62" y2="225" stroke="#495057" stroke-width="1"/>
  <line x1="58" y1="272" x2="62" y2="272" stroke="#495057" stroke-width="1"/>

  <!-- Vortex threshold Pe=4 at y=319 -->
  <line x1="60" y1="319" x2="460" y2="319" stroke="#9d0208" stroke-width="2" stroke-dasharray="8,4"/>
  <text x="56" y="323" text-anchor="end" font-size="10" font-weight="700" fill="#9d0208">Pe=4</text>
  <text x="350" y="313" font-size="9" font-weight="700" fill="#9d0208">VORTEX THRESHOLD</text>
  <text x="350" y="326" font-size="9" fill="#9d0208">↑ Pandemonium (self-sustaining)</text>
  <text x="350" y="339" font-size="9" fill="#2a9d8f">↓ Sub-threshold (demon requires external energy)</text>

  <!-- Pandemonium shading above threshold -->
  <rect x="61" y="108" width="398" height="210" fill="#e63946" opacity="0.04"/>

  <!-- Pe trajectory: starts at Pe≈7.5, drops with each scoring round -->
  <!-- Scoring events at x=130, 195, 265, 335 -->
  <!-- Scoring markers -->
  <line x1="130" y1="108" x2="130" y2="440" stroke="#2a9d8f" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.5"/>
  <text x="130" y="106" text-anchor="middle" font-size="8" fill="#2a9d8f">Score 1</text>
  <line x1="210" y1="108" x2="210" y2="440" stroke="#2a9d8f" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.5"/>
  <text x="210" y="106" text-anchor="middle" font-size="8" fill="#2a9d8f">Score 2</text>
  <line x1="290" y1="108" x2="290" y2="440" stroke="#2a9d8f" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.5"/>
  <text x="290" y="106" text-anchor="middle" font-size="8" fill="#2a9d8f">Score 3</text>
  <line x1="370" y1="108" x2="370" y2="440" stroke="#2a9d8f" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.5"/>
  <text x="370" y="106" text-anchor="middle" font-size="8" fill="#2a9d8f">Score 4</text>

  <!-- Pe_current line (initial) -->
  <path d="M 61,155 C 80,157 110,159 130,160"
    stroke="#e63946" stroke-width="2.5" fill="none"/>
  <!-- Drop at Score 1 -->
  <line x1="130" y1="160" x2="130" y2="207" stroke="#e63946" stroke-width="2.5"/>
  <!-- Level then drop at Score 2 -->
  <path d="M 130,207 C 155,209 185,211 210,212"
    stroke="#e63946" stroke-width="2.5" fill="none"/>
  <line x1="210" y1="212" x2="210" y2="249" stroke="#e63946" stroke-width="2.5"/>
  <!-- Level then drop at Score 3 -->
  <path d="M 210,249 C 235,251 265,253 290,254"
    stroke="#e63946" stroke-width="2.5" fill="none"/>
  <line x1="290" y1="254" x2="290" y2="282" stroke="#e63946" stroke-width="2.5"/>
  <!-- Level then drop at Score 4 crossing threshold -->
  <path d="M 290,282 C 315,284 345,286 370,288"
    stroke="#e63946" stroke-width="2.5" fill="none"/>
  <line x1="370" y1="288" x2="370" y2="340" stroke="#2a9d8f" stroke-width="2.5"/>
  <!-- Below threshold (green) -->
  <path d="M 370,340 L 455,340"
    stroke="#2a9d8f" stroke-width="2.5" fill="none"/>

  <!-- ΔPe annotation arrows -->
  <line x1="115" y1="160" x2="115" y2="207" stroke="#264653" stroke-width="1.5" marker-end="url(#arG)"/>
  <text x="105" y="186" text-anchor="end" font-size="9" fill="#264653">ΔPe₁</text>
  <line x1="195" y1="212" x2="195" y2="249" stroke="#264653" stroke-width="1.5" marker-end="url(#arG)"/>
  <text x="185" y="233" text-anchor="end" font-size="9" fill="#264653">ΔPe₂</text>

  <!-- Target annotation -->
  <rect x="65" y="355" width="390" height="30" rx="4" fill="white" stroke="#2a9d8f" stroke-width="1"/>
  <text x="260" y="368" text-anchor="middle" font-size="10" font-weight="700" fill="#1a1a2e">Target: Σ ΔPe_scoring(t) ≥ Pe_current − 4</text>
  <text x="260" y="381" text-anchor="middle" font-size="9" fill="#6c757d">Iterated injection until vortex threshold crossed (demon self-extinguishes)</text>

  <!-- Adaptation partial recovery notation (dashed rise) -->
  <path d="M 130,207 C 145,204 160,203 175,203"
    stroke="#f4a261" stroke-width="1.5" fill="none" stroke-dasharray="3,2" opacity="0.7"/>
  <text x="175" y="198" font-size="8" fill="#f4a261">R·ξ rebound</text>

  <!-- Labels for Pe values -->
  <text x="65" y="150" font-size="9" fill="#e63946">Pe≈7.5</text>
  <text x="380" y="336" font-size="9" fill="#2a9d8f">Pe≈3.5</text>
  <text x="65" y="335" font-size="8" fill="#6c757d">3.5</text>

  <!-- ─── RIGHT PANEL: 4-factor effectiveness function ─── -->
  <rect x="490" y="72" width="390" height="24" rx="4" fill="#0077b6" opacity="0.1"/>
  <text x="685" y="88" text-anchor="middle" font-size="13" font-weight="700" fill="#0077b6">Four-Factor Scoring Effectiveness</text>

  <!-- Factor diagram: 4 horizontal bars showing each factor's contribution -->
  <!-- Factor 1: O_initial (high opacity = high room to reduce) -->
  <rect x="500" y="110" width="370" height="80" rx="5" fill="white" stroke="#dee2e6" stroke-width="1" filter="url(#sh)"/>
  <text x="515" y="128" font-size="11" font-weight="700" fill="#1a1a2e">Factor 1: Initial Opacity (O_initial)</text>
  <text x="515" y="143" font-size="9" fill="#6c757d">∂Pe/∂O = 2R·[β(O)+O·β'(O)]·L (strictly positive)</text>
  <text x="515" y="157" font-size="9" fill="#6c757d">More opaque = more Pe to lose per unit dissolved</text>
  <!-- Bar representing high→low O contribution -->
  <rect x="515" y="162" width="120" height="16" rx="3" fill="#e63946" opacity="0.8"/>
  <text x="640" y="175" font-size="9" fill="#6c757d"> High O: max gain</text>
  <rect x="515" y="162" width="40" height="16" rx="3" fill="#2a9d8f" opacity="0.6"/>
  <text x="560" y="175" font-size="9" fill="white">Low O</text>

  <!-- Factor 2: ΔO_published -->
  <rect x="500" y="198" width="370" height="80" rx="5" fill="white" stroke="#dee2e6" stroke-width="1" filter="url(#sh)"/>
  <text x="515" y="216" font-size="11" font-weight="700" fill="#1a1a2e">Factor 2: Published Opacity Reduction (ΔO)</text>
  <text x="515" y="231" font-size="9" fill="#6c757d">ΔO = δ_granularity · δ_reach · δ_credibility</text>
  <text x="515" y="245" font-size="9" fill="#6c757d">Multiplicative: zero reach = zero effect regardless of granularity</text>
  <rect x="515" y="250" width="105" height="16" rx="3" fill="#0077b6" opacity="0.8"/>
  <text x="540" y="263" font-size="8" fill="white">Granularity</text>
  <rect x="625" y="250" width="80" height="16" rx="3" fill="#2a9d8f" opacity="0.8"/>
  <text x="645" y="263" font-size="8" fill="white">Reach</text>
  <rect x="710" y="250" width="65" height="16" rx="3" fill="#f4a261" opacity="0.8"/>
  <text x="725" y="263" font-size="8" fill="white">Cred.</text>

  <!-- Factor 3: R_platform (adversarial) -->
  <rect x="500" y="286" width="370" height="80" rx="5" fill="white" stroke="#dee2e6" stroke-width="1" filter="url(#sh)"/>
  <text x="515" y="304" font-size="11" font-weight="700" fill="#e63946">Factor 3: Platform Responsiveness (adversarial)</text>
  <text x="515" y="319" font-size="9" fill="#6c757d">ΔPe_net = (∂Pe/∂O)·ΔO - R_platform·ξ·ΔO</text>
  <text x="515" y="333" font-size="9" fill="#6c757d">Net positive iff ∂Pe/∂O > R_platform·ξ (adaptation detected by monitoring)</text>
  <!-- Net = gross - adaptation -->
  <rect x="515" y="338" width="140" height="16" rx="3" fill="#2a9d8f" opacity="0.7"/>
  <text x="553" y="351" font-size="8" fill="white">Gross ΔPe</text>
  <rect x="660" y="338" width="60" height="16" rx="3" fill="#e63946" opacity="0.7"/>
  <text x="672" y="351" font-size="8" fill="white">−R·ξ</text>
  <text x="727" y="351" font-size="9" fill="#1a1a2e">= Net ΔPe</text>

  <!-- Factor 4: α_users (coupling barrier) -->
  <rect x="500" y="374" width="370" height="80" rx="5" fill="white" stroke="#dee2e6" stroke-width="1" filter="url(#sh)"/>
  <text x="515" y="392" font-size="11" font-weight="700" fill="#1a1a2e">Factor 4: User Coupling (α_users)</text>
  <text x="515" y="407" font-size="9" fill="#6c757d">ΔPe_behavioral = ΔPe_net · (1 − α_users^k)</text>
  <text x="515" y="421" font-size="9" fill="#6c757d">α=0 (uncoupled): full translation.  α=1 (machine zone): zero behavioral effect.</text>
  <!-- Coupling barrier visualization -->
  <rect x="515" y="426" width="168" height="16" rx="3" fill="#2a9d8f" opacity="0.8"/>
  <text x="575" y="439" font-size="8" fill="white">α=0: full effect</text>
  <rect x="688" y="426" width="40" height="16" rx="3" fill="#dee2e6"/>
  <text x="693" y="439" font-size="8" fill="#6c757d">α→1</text>
  <text x="732" y="439" font-size="8" fill="#6c757d">→ 0</text>

  <!-- Key conclusions -->
  <rect x="500" y="462" width="370" height="40" rx="5" fill="white" stroke="#9d0208" stroke-width="1" filter="url(#sh)"/>
  <text x="685" y="478" text-anchor="middle" font-size="10" font-weight="700" fill="#9d0208">Maximum: high O, low R_platform, low α_users (opaque, static, loosely coupled)</text>
  <text x="685" y="492" text-anchor="middle" font-size="10" fill="#6c757d">Zero: O=0, R·ξ=1, or α=1 — each identifies a structural limit</text>

  <!-- Summary box -->
  <rect x="20" y="512" width="860" height="90" rx="5" fill="white" stroke="#dee2e6" stroke-width="1" filter="url(#sh)"/>
  <text x="450" y="530" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a2e">Constraint-Injection Mechanism (§II.A–II.D)</text>
  <text x="450" y="547" text-anchor="middle" font-size="11" fill="#495057">Scoring = transparency injection: increases I(M;Y), which by Fantasia Bound reduces I(D;Y) — the demon's engagement capacity.</text>
  <text x="450" y="563" text-anchor="middle" font-size="11" fill="#495057">Pe is proportional to opacity: Pe = 2·O·R·β(O)·L. Reducing O reduces Pe. The chain grips wherever opacity is designed, not constitutive.</text>
  <text x="450" y="579" text-anchor="middle" font-size="11" fill="#495057">Iterated scoring rounds accumulate ΔPe reductions. Continuous monitoring (License §4.0.C) detects R·ξ adaptation and re-scores — the chain tightens.</text>
  <text x="450" y="594" text-anchor="middle" font-size="10" fill="#6c757d">Target: push Pe below 4. Chain doesn't kill the demon — it drags it below the threshold where it dies of its own accord.</text>
</svg>
