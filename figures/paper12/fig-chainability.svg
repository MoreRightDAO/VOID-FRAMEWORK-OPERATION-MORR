<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <filter id="sh"><feDropShadow dx="1" dy="1" stdDeviation="2" flood-opacity="0.1"/></filter>
    <marker id="ax" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#495057"/>
    </marker>
    <marker id="dn" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2a9d8f"/>
    </marker>
    <marker id="flat" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#9d0208"/>
    </marker>
  </defs>

  <rect width="900" height="620" fill="#fafafa" rx="8"/>
  <text x="450" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#1a1a2e">Chainable vs. Unchainable: The Formal Partition (§V)</text>
  <text x="450" y="53" text-anchor="middle" font-size="13" fill="#6c757d">Designed opacity responds to transparency injection. Constitutive opacity is invariant under measurement. The chain has nothing to grip.</text>

  <!-- Divider -->
  <line x1="450" y1="72" x2="450" y2="490" stroke="#dee2e6" stroke-width="2"/>

  <!-- ─── LEFT: CHAINABLE ─── -->
  <rect x="20" y="72" width="420" height="30" rx="4" fill="#2a9d8f" opacity="0.15"/>
  <text x="230" y="91" text-anchor="middle" font-size="14" font-weight="700" fill="#2a9d8f">CHAINABLE — Designed Opacity</text>

  <!-- Three conditions box -->
  <rect x="25" y="110" width="415" height="105" rx="6" fill="white" stroke="#2a9d8f" stroke-width="1.5" filter="url(#sh)"/>
  <text x="232" y="128" text-anchor="middle" font-size="11" font-weight="700" fill="#1a1a2e">Chainability Criterion (all three must hold):</text>
  <text x="40" y="147" font-size="10" fill="#2a9d8f">① Opacity is DESIGNED — could be otherwise without destroying function</text>
  <text x="40" y="163" font-size="10" fill="#2a9d8f">② ∂Pe/∂O &gt; 0 — reducing opacity reduces the demon's Péclet number</text>
  <text x="40" y="179" font-size="10" fill="#2a9d8f">③ ΔO achievable — scoring pipeline can reach and publish the opacity</text>
  <text x="232" y="205" text-anchor="middle" font-size="9" fill="#6c757d">All three: demon is chainable.  Any one fails: demon is unchainable.</text>

  <!-- Pe response curve for chainable: Pe drops with scoring -->
  <rect x="25" y="222" width="415" height="100" rx="5" fill="white" stroke="#dee2e6" stroke-width="1" filter="url(#sh)"/>
  <text x="232" y="240" text-anchor="middle" font-size="10" font-weight="700" fill="#1a1a2e">Pe response to scoring rounds:</text>
  <line x1="45" y1="305" x2="425" y2="305" stroke="#495057" stroke-width="1" marker-end="url(#ax)"/>
  <line x1="45" y1="305" x2="45" y2="248" stroke="#495057" stroke-width="1" marker-end="url(#ax)"/>
  <!-- Vortex threshold line -->
  <line x1="45" y1="280" x2="420" y2="280" stroke="#9d0208" stroke-width="1" stroke-dasharray="5,3"/>
  <text x="425" y="284" font-size="8" fill="#9d0208">Pe=4</text>
  <!-- Decreasing Pe curve -->
  <path d="M 60,260 L 120,262 L 120,272 L 190,274 L 190,281 L 260,283 L 260,290 L 330,292 L 410,292"
    stroke="#2a9d8f" stroke-width="2.5" fill="none" stroke-linejoin="round"/>
  <circle cx="60" cy="260" r="3" fill="#e63946"/>
  <circle cx="120" cy="262" r="3" fill="#2a9d8f" opacity="0.5"/>
  <circle cx="190" cy="274" r="3" fill="#2a9d8f" opacity="0.7"/>
  <circle cx="260" cy="281" r="3" fill="#2a9d8f"/>
  <circle cx="330" cy="290" r="3" fill="#2a9d8f"/>
  <text x="55" y="257" font-size="8" fill="#6c757d">Pe₀</text>
  <text x="310" y="302" font-size="8" fill="#2a9d8f">→ below Pe=4</text>
  <text x="150" y="247" font-size="9" fill="#2a9d8f">Pe drops with each scoring round</text>

  <!-- Examples of chainable demons -->
  <rect x="25" y="328" width="415" height="130" rx="5" fill="white" stroke="#dee2e6" stroke-width="1" filter="url(#sh)"/>
  <text x="232" y="347" text-anchor="middle" font-size="10" font-weight="700" fill="#1a1a2e">Chainable Domains:</text>

  <!-- Type A-F rows -->
  <text x="38" y="365" font-size="9" fill="#e63946" font-weight="700">Type A–F</text>
  <text x="95" y="365" font-size="9" fill="#495057">All commercially operated demon types respond to measurement</text>
  <text x="38" y="381" font-size="9" fill="#2a9d8f">Social media</text>
  <text x="115" y="381" font-size="9" fill="#6c757d">Algorithm opacity = corporate policy. Could be published. ∂Pe/∂O &gt; 0.</text>
  <text x="38" y="397" font-size="9" fill="#2a9d8f">Fintech</text>
  <text x="115" y="397" font-size="9" fill="#6c757d">Spread opacity is designed to obscure cost. Scoring dissolves it.</text>
  <text x="38" y="413" font-size="9" fill="#2a9d8f">Dating apps</text>
  <text x="115" y="413" font-size="9" fill="#6c757d">Matching algorithm opacity engineered for engagement. Reachable.</text>
  <text x="38" y="429" font-size="9" fill="#2a9d8f">Crypto/DeFi</text>
  <text x="115" y="429" font-size="9" fill="#6c757d">Protocol opacity = design choice (Papers 7, 12). Chain grips here.</text>
  <text x="232" y="450" text-anchor="middle" font-size="9" fill="#6c757d" font-style="italic">All: opacity could be otherwise. Scoring creates incentive for it to be otherwise.</text>

  <!-- ─── RIGHT: UNCHAINABLE ─── -->
  <rect x="460" y="72" width="420" height="30" rx="4" fill="#9d0208" opacity="0.1"/>
  <text x="670" y="91" text-anchor="middle" font-size="14" font-weight="700" fill="#9d0208">UNCHAINABLE — Constitutive Opacity</text>

  <!-- Definition -->
  <rect x="465" y="110" width="415" height="80" rx="6" fill="white" stroke="#9d0208" stroke-width="1.5" filter="url(#sh)"/>
  <text x="672" y="128" text-anchor="middle" font-size="11" font-weight="700" fill="#1a1a2e">Constitutive Immunity Corollary:</text>
  <text x="480" y="147" font-size="10" fill="#9d0208">If D's opacity is constitutive, ∂Pe/∂O = 0 under scoring.</text>
  <text x="480" y="163" font-size="10" fill="#495057">The scoring pipeline targets DESIGNED opacity only.</text>
  <text x="480" y="178" font-size="9" fill="#6c757d">Constitutive opacity is invariant under measurement. Chain slides off.</text>

  <!-- Pe response for unchainable: flat -->
  <rect x="465" y="198" width="415" height="100" rx="5" fill="white" stroke="#dee2e6" stroke-width="1" filter="url(#sh)"/>
  <text x="672" y="216" text-anchor="middle" font-size="10" font-weight="700" fill="#1a1a2e">Pe response to scoring rounds:</text>
  <line x1="485" y1="280" x2="860" y2="280" stroke="#495057" stroke-width="1" marker-end="url(#ax)"/>
  <line x1="485" y1="280" x2="485" y2="222" stroke="#495057" stroke-width="1" marker-end="url(#ax)"/>
  <!-- Vortex threshold -->
  <line x1="485" y1="254" x2="856" y2="254" stroke="#9d0208" stroke-width="1" stroke-dasharray="5,3"/>
  <text x="857" y="258" font-size="8" fill="#9d0208">Pe=4</text>
  <!-- Flat Pe curve (no response) -->
  <path d="M 498,238 L 855,238"
    stroke="#9d0208" stroke-width="2.5" fill="none" stroke-dasharray="7,3"/>
  <circle cx="498" cy="238" r="3" fill="#9d0208"/>
  <!-- No-response arrows at scoring events -->
  <line x1="580" y1="238" x2="580" y2="266" stroke="#9d0208" stroke-width="1" stroke-dasharray="2,2" opacity="0.5"/>
  <text x="580" y="270" text-anchor="middle" font-size="7" fill="#9d0208">Score 1</text>
  <line x1="680" y1="238" x2="680" y2="266" stroke="#9d0208" stroke-width="1" stroke-dasharray="2,2" opacity="0.5"/>
  <text x="680" y="270" text-anchor="middle" font-size="7" fill="#9d0208">Score 2</text>
  <text x="672" y="234" text-anchor="middle" font-size="9" fill="#9d0208">Pe unchanged — chain has nothing to grip</text>

  <!-- Three unchainable classes -->
  <rect x="465" y="305" width="415" height="165" rx="5" fill="white" stroke="#dee2e6" stroke-width="1" filter="url(#sh)"/>
  <text x="672" y="323" text-anchor="middle" font-size="10" font-weight="700" fill="#1a1a2e">Three Unchainable Classes:</text>

  <rect x="475" y="330" width="394" height="38" rx="4" fill="#9d0208" opacity="0.05" stroke="#9d0208" stroke-width="0.5"/>
  <text x="485" y="346" font-size="9" font-weight="700" fill="#9d0208">Class 1: Constitutive Voids</text>
  <text x="485" y="360" font-size="9" fill="#495057">Consciousness, quantum measurement, free will — opacity IS the phenomenon.</text>

  <rect x="475" y="372" width="394" height="48" rx="4" fill="#9d0208" opacity="0.05" stroke="#9d0208" stroke-width="0.5"/>
  <text x="485" y="388" font-size="9" font-weight="700" fill="#9d0208">Class 2: Type G at Self-Sustaining Threshold</text>
  <text x="485" y="402" font-size="9" fill="#495057">P_ongoing(t) → 0; observer's cognition IS the substrate. Cannot be scored by an API.</text>
  <text x="485" y="416" font-size="9" fill="#495057">Requires Type 2 external injection — energy from outside voidspace.</text>

  <rect x="475" y="424" width="394" height="38" rx="4" fill="#9d0208" opacity="0.05" stroke="#9d0208" stroke-width="0.5"/>
  <text x="485" y="440" font-size="9" font-weight="700" fill="#9d0208">Class 3: The Exterior of Voidspace</text>
  <text x="485" y="454" font-size="9" fill="#495057">Framework identifies the exterior exists (boundary derived) but cannot chain it from inside V.</text>

  <!-- Summary box -->
  <rect x="20" y="498" width="860" height="106" rx="5" fill="white" stroke="#dee2e6" stroke-width="1" filter="url(#sh)"/>
  <text x="450" y="516" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a2e">Chainability Criterion (§V.A) — The Formal Partition</text>
  <text x="450" y="533" text-anchor="middle" font-size="11" fill="#495057">A framework that claims to solve everything is a void: opaque (hides what it can't do), responsive (adapts claims), attention-capturing (universal promise).</text>
  <text x="450" y="549" text-anchor="middle" font-size="11" fill="#495057">Scoring resources concentrated on chainable demons where ΔPe_scoring &gt; 0. Predictions about Pe reduction in constitutive domains should be exactly zero.</text>
  <text x="450" y="565" text-anchor="middle" font-size="11" fill="#495057">The chain's honest limit = the boundary of voidspace itself. For unchainable demons, the framework identifies the requirement (Type 2 injection) but cannot provide it.</text>
  <text x="450" y="581" text-anchor="middle" font-size="10" fill="#6c757d">P12-4: Chainable demons show Pe response to scoring (p&lt;0.05). Unchainable demons show response indistinguishable from zero. This falsifies any claim of universal applicability.</text>
  <text x="450" y="596" text-anchor="middle" font-size="10" fill="#6c757d">Distinction between descriptive power (framework can describe any voidspace point) and operational power (scoring pipeline only chains designed opacity).</text>
</svg>
