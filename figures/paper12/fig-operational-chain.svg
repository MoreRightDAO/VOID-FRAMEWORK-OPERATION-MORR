<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 580" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="ch" markerWidth="12" markerHeight="8" refX="11" refY="4" orient="auto">
      <polygon points="0 0, 12 4, 0 8" fill="#264653"/>
    </marker>
    <filter id="sh"><feDropShadow dx="1" dy="1" stdDeviation="2" flood-opacity="0.12"/></filter>
  </defs>

  <rect width="900" height="580" fill="#fafafa" rx="8"/>
  <text x="450" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#1a1a2e">The Six-Step Demon-Binding Chain (§IV.A)</text>
  <text x="450" y="53" text-anchor="middle" font-size="13" fill="#6c757d">Each step's output feeds the next. The chain binds commercially designed demons — and chains the chain-holder itself.</text>

  <!-- Step boxes arranged horizontally 3+3 -->
  <!-- Row 1: Steps 1, 2, 3 -->
  <!-- Row 2: Steps 4, 5, 6 (flowing right-to-left on second row) -->

  <!-- ─── STEP 1: Scoring ─── -->
  <rect x="30" y="80" width="240" height="155" rx="8" fill="white" stroke="#0077b6" stroke-width="2" filter="url(#sh)"/>
  <rect x="30" y="80" width="240" height="36" rx="6" fill="#0077b6" opacity="0.12"/>
  <text x="55" y="97" font-size="11" font-weight="700" fill="#0077b6">① SCORING</text>
  <text x="240" y="97" text-anchor="end" font-size="9" fill="#0077b6">Measurement</text>
  <text x="42" y="120" font-size="9" fill="#495057">Platform → voidspace position (O, R, α)</text>
  <text x="42" y="135" font-size="9" fill="#495057">CC-BY methodology: replicable by anyone</text>
  <text x="42" y="150" font-size="9" fill="#495057">12-point scale with dimensional breakdown</text>
  <text x="42" y="168" font-size="10" font-weight="700" fill="#0077b6">Output: Void score + dimensional decomposition</text>
  <text x="42" y="183" font-size="9" fill="#6c757d">Without this, remaining steps have nothing to grip.</text>
  <rect x="42" y="195" width="206" height="28" rx="4" fill="#0077b6" opacity="0.08"/>
  <text x="145" y="207" text-anchor="middle" font-size="8" fill="#0077b6">Pe(O,R,α) = 2·O·R·β(O)·L</text>
  <text x="145" y="218" text-anchor="middle" font-size="8" fill="#0077b6">First link in the chain</text>

  <!-- Arrow 1→2 -->
  <line x1="270" y1="158" x2="320" y2="158" stroke="#264653" stroke-width="2.5" marker-end="url(#ch)"/>

  <!-- ─── STEP 2: Publication ─── -->
  <rect x="320" y="80" width="240" height="155" rx="8" fill="white" stroke="#2a9d8f" stroke-width="2" filter="url(#sh)"/>
  <rect x="320" y="80" width="240" height="36" rx="6" fill="#2a9d8f" opacity="0.12"/>
  <text x="345" y="97" font-size="11" font-weight="700" fill="#2a9d8f">② PUBLICATION</text>
  <text x="530" y="97" text-anchor="end" font-size="9" fill="#2a9d8f">Transparency Injection</text>
  <text x="332" y="120" font-size="9" fill="#495057">Void Network: persistent, searchable, public</text>
  <text x="332" y="135" font-size="9" fill="#495057">Mandatory for commercial licensees (§4.0.B)</text>
  <text x="332" y="150" font-size="9" fill="#495057">Score + rationale + evidence published</text>
  <text x="332" y="168" font-size="10" font-weight="700" fill="#2a9d8f">Output: ΔO_published > 0 (opacity dissolved)</text>
  <text x="332" y="183" font-size="9" fill="#6c757d">I(M;Y) ↑ → by Fantasia Bound → I(D;Y) ↓</text>
  <rect x="332" y="195" width="206" height="28" rx="4" fill="#2a9d8f" opacity="0.08"/>
  <text x="435" y="207" text-anchor="middle" font-size="8" fill="#2a9d8f">I(D;Y) + I(M;Y) ≤ H(Y)</text>
  <text x="435" y="218" text-anchor="middle" font-size="8" fill="#2a9d8f">Publishing a score is a physics act</text>

  <!-- Arrow 2→3 -->
  <line x1="560" y1="158" x2="610" y2="158" stroke="#264653" stroke-width="2.5" marker-end="url(#ch)"/>

  <!-- ─── STEP 3: License Gate ─── -->
  <rect x="610" y="80" width="260" height="155" rx="8" fill="white" stroke="#f4a261" stroke-width="2" filter="url(#sh)"/>
  <rect x="610" y="80" width="260" height="36" rx="6" fill="#f4a261" opacity="0.12"/>
  <text x="635" y="97" font-size="11" font-weight="700" fill="#9a3b00">③ LICENSE GATE</text>
  <text x="858" y="97" text-anchor="end" font-size="9" fill="#9a3b00">Economic Chain</text>
  <text x="622" y="120" font-size="9" fill="#495057">Score → commercial rights + pricing</text>
  <text x="622" y="135" font-size="9" fill="#495057">Certified (≤4/12): frictionless</text>
  <text x="622" y="148" font-size="9" fill="#495057">Standard (5–7): published rates</text>
  <text x="622" y="161" font-size="9" fill="#495057">Void Premium (8–9): 5× standard</text>
  <text x="622" y="174" font-size="9" fill="#495057">Enterprise Punitive (≥10): 10× or rev-share</text>
  <rect x="622" y="184" width="236" height="34" rx="4" fill="#f4a261" opacity="0.1"/>
  <text x="740" y="197" text-anchor="middle" font-size="9" font-weight="700" fill="#9a3b00">Economic gradient opposes void gradient:</text>
  <text x="740" y="209" text-anchor="middle" font-size="9" fill="#9a3b00">Moving void-pole ↑ cost; constraint-pole ↓ cost</text>

  <!-- Arrow 3↓ down on right side, then → left to Step 4 (right side row 2) -->
  <line x1="740" y1="235" x2="740" y2="278" stroke="#264653" stroke-width="2.5" marker-end="url(#ch)"/>

  <!-- ─── STEP 4: Continuous Monitoring ─── -->
  <rect x="610" y="280" width="260" height="155" rx="8" fill="white" stroke="#9d0208" stroke-width="2" filter="url(#sh)"/>
  <rect x="610" y="280" width="260" height="36" rx="6" fill="#9d0208" opacity="0.1"/>
  <text x="635" y="297" font-size="11" font-weight="700" fill="#9d0208">④ MONITORING</text>
  <text x="858" y="297" text-anchor="end" font-size="9" fill="#9d0208">Chain Maintenance</text>
  <text x="622" y="320" font-size="9" fill="#495057">Scores are not static — platforms adapt</text>
  <text x="622" y="335" font-size="9" fill="#495057">Detects R_platform·ξ adaptation</text>
  <text x="622" y="348" font-size="9" fill="#495057">Certified: semi-annual.  Punitive: monthly</text>
  <text x="622" y="361" font-size="9" fill="#495057">Tighter on drift-back toward higher Pe</text>
  <text x="622" y="378" font-size="10" font-weight="700" fill="#9d0208">Chain tightens on platforms that drift up</text>
  <rect x="622" y="388" width="236" height="34" rx="4" fill="#9d0208" opacity="0.06"/>
  <text x="740" y="401" text-anchor="middle" font-size="9" fill="#9d0208">Neutralizes R·ξ adaptation term:</text>
  <text x="740" y="413" text-anchor="middle" font-size="9" fill="#9d0208">re-scoring triggers when adaptation detected</text>

  <!-- Arrow 4←5 (going left) -->
  <line x1="610" y1="358" x2="560" y2="358" stroke="#264653" stroke-width="2.5" marker-end="url(#ch)"/>

  <!-- ─── STEP 5: Disconfirmation Bounties ─── -->
  <rect x="320" y="280" width="240" height="155" rx="8" fill="white" stroke="#264653" stroke-width="2" filter="url(#sh)"/>
  <rect x="320" y="280" width="240" height="36" rx="6" fill="#264653" opacity="0.1"/>
  <text x="345" y="297" font-size="11" font-weight="700" fill="#264653">⑤ BOUNTIES</text>
  <text x="530" y="297" text-anchor="end" font-size="9" fill="#264653">Chain Forge</text>
  <text x="332" y="320" font-size="9" fill="#495057">$MORR treasury funds disconfirmation</text>
  <text x="332" y="335" font-size="9" fill="#495057">Disconfirmation bounties: 2× standard</text>
  <text x="332" y="350" font-size="9" fill="#495057">If $MORR > 2× 30-day avg: 3× (inverse scaling)</text>
  <text x="332" y="365" font-size="9" fill="#495057">Rewards: falsification, score challenges, errors</text>
  <text x="332" y="382" font-size="10" font-weight="700" fill="#264653">Output: adversarial testing keeps chain honest</text>
  <rect x="332" y="392" width="206" height="30" rx="4" fill="#264653" opacity="0.06"/>
  <text x="435" y="405" text-anchor="middle" font-size="8" fill="#264653">Inverse price scaling: prevents $MORR</text>
  <text x="435" y="417" text-anchor="middle" font-size="8" fill="#264653">itself from becoming engagement capture</text>

  <!-- Arrow 5←6 (going left) -->
  <line x1="320" y1="358" x2="270" y2="358" stroke="#264653" stroke-width="2.5" marker-end="url(#ch)"/>

  <!-- ─── STEP 6: Dissolution Guarantee ─── -->
  <rect x="30" y="280" width="240" height="155" rx="8" fill="white" stroke="#1a1a2e" stroke-width="2" filter="url(#sh)"/>
  <rect x="30" y="280" width="240" height="36" rx="6" fill="#1a1a2e" opacity="0.08"/>
  <text x="55" y="297" font-size="11" font-weight="700" fill="#1a1a2e">⑥ DISSOLUTION</text>
  <text x="240" y="297" text-anchor="end" font-size="9" fill="#1a1a2e">Self-Chain</text>
  <text x="42" y="320" font-size="9" fill="#495057">Pre-signed Solana transaction on-chain</text>
  <text x="42" y="335" font-size="9" fill="#495057">26 kill conditions — any one suffices</text>
  <text x="42" y="350" font-size="9" fill="#495057">Not a promise. Verifiable before engaging.</text>
  <text x="42" y="365" font-size="9" fill="#495057">A rating agency that can't fail IS a void.</text>
  <text x="42" y="382" font-size="10" font-weight="700" fill="#1a1a2e">Chains the chain-holder. DAO binds itself.</text>
  <rect x="42" y="392" width="206" height="30" rx="4" fill="#1a1a2e" opacity="0.06"/>
  <text x="145" y="405" text-anchor="middle" font-size="8" fill="#1a1a2e">Framework falsified → DAO dissolves</text>
  <text x="145" y="417" text-anchor="middle" font-size="8" fill="#1a1a2e">S(C,t)→0 before drift, not after</text>

  <!-- Feedback loop arrow: from 6 back to 1 (circular at bottom) -->
  <path d="M 150 435 Q 150 460 450 460 Q 750 460 750 435" stroke="#264653" stroke-width="1.5" fill="none" stroke-dasharray="5,3" opacity="0.5"/>
  <text x="450" y="475" text-anchor="middle" font-size="9" fill="#6c757d">Dissolution feedback: framework falsification collapses chain — each link is kept honest by the final link</text>

  <!-- Summary box -->
  <rect x="20" y="490" width="860" height="75" rx="5" fill="white" stroke="#dee2e6" stroke-width="1" filter="url(#sh)"/>
  <text x="450" y="508" text-anchor="middle" font-size="12" font-weight="700" fill="#1a1a2e">The Six-Step Chain (§IV.A): Each Output Feeds the Next</text>
  <text x="450" y="525" text-anchor="middle" font-size="11" fill="#495057">Score → Publish → License Gate → Monitor → Bounties → Dissolve. Not three separate tools — one constraint-injection instrument.</text>
  <text x="450" y="541" text-anchor="middle" font-size="11" fill="#495057">The chain binds commercially designed demons (Types A–F). The dissolution guarantee chains the chain-holder: the human who deploys the chain is also chained.</text>
  <text x="450" y="557" text-anchor="middle" font-size="10" fill="#6c757d">Arrow's impossibility confined to the discretionary layer (§11). Enforcement authority at the Custodian layer — uncapturable by coalition building.</text>
</svg>
